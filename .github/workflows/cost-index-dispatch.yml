# Cost Index MONTHLY dispatch — publishes the dated write-up, then emails it.
# (Weekly until the 2026-07-06 cadence pivot; first monthly send 2026-08-04.)
#
# Runs the first Tuesday of each month, an hour after the Mon/Wed/Fri measured
# refresh (cost-index-refresh.yml, 13:00 UTC) so Monday's fresh
# data/cost-index.json is committed and checked out before the post is built —
# never a race that writes the post off stale numbers.
#
# Note the refresh SELF-HEALS the post: if this monthly run is ever missed, the
# next refresh republishes the dated post (post only, no email) the moment the
# data is more than a month ahead of it (check-cost-index-dispatch-fresh.mjs).
# This first-Tuesday run remains the canonical cadence and is the one that sends
# the monthly broadcast email.
#
# Each edition it: (1) generates the dated dispatch at blog/cost-index-week-<asOf>/
# (the slug family is dated, so it carries across the cadence change; existing
# slugs are final-forever), registers it (RSS, sitemap, blog index, glossary
# backlinks), gates it, and commits it so Cloudflare deploys the published post;
# then (2) POSTs the edition's insight to the Worker's secret-gated broadcast
# endpoint, which renders costIndexWeeklyEmail and sends it to every ACTIVE
# 'cost-index' subscriber, linking to that dated post.
#
# The broadcast is IDEMPOTENT per edition (Worker stamps the asOf), so a re-run
# never double-sends. Nothing emails unless COST_INDEX_BROADCAST_SECRET is set
# here AND on the Worker (they must match). Manual dispatch defaults to dry-run =
# preview only: prints the insight, publishes nothing, sends nothing.
#
# Secret (Settings → Secrets and variables → Actions):
#   COST_INDEX_BROADCAST_SECRET — high-entropy shared secret, also `wrangler secret put`
#                                 on the Worker as COST_INDEX_BROADCAST_SECRET.

name: Cost Index monthly dispatch

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'dry-run = print the insight, publish nothing, send nothing'
        type: boolean
        default: true
  schedule:
    # MONTHLY (2026-07-06 cadence pivot, founder call): first Tuesday of the
    # month, 14:00 UTC — an hour after the 13:00 UTC measured refresh (now
    # Mon/Wed/Fri), so Monday's data is committed and settled before the post
    # publishes and the email goes out. GitHub cron can't express "first
    # Tuesday" (DOM+DOW are OR'd), so the cron still fires every Tuesday and
    # the first gate step below exits cleanly on all but the first.
    - cron: '0 14 * * 2'

permissions:
  contents: write   # publishes the dated dispatch post

concurrency:
  group: cost-index-dispatch
  cancel-in-progress: false   # never interrupt a publish/send mid-flight

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Monthly gate — first Tuesday only (manual dispatches always pass)
        # Cron fires every Tuesday (see above); this keeps only the first Tuesday
        # of each month. The start guard skips July 2026 entirely: the cadence
        # pivot merged the night before 2026-07-07 (a first Tuesday), and the
        # founder's call was that the weekly does NOT fire — the first monthly
        # dispatch is 2026-08-04. workflow_dispatch bypasses both guards so a
        # manual send stays possible any day.
        if: github.event_name == 'schedule'
        run: |
          dom=$(date -u +%-d)
          if [ "$dom" -gt 7 ]; then
            echo "Not the first Tuesday (day $dom) — monthly dispatch skips this week."
            echo "SKIP_DISPATCH=1" >> "$GITHUB_ENV"
          fi
          if [ "$(date -u +%Y-%m-%d)" \< "2026-08-01" ]; then
            echo "Before the 2026-08-04 monthly start — skipping (cadence pivot 2026-07-06)."
            echo "SKIP_DISPATCH=1" >> "$GITHUB_ENV"
          fi

      - name: Check out
        if: env.SKIP_DISPATCH != '1'
        uses: actions/checkout@v5

      - name: Set up Node 20
        if: env.SKIP_DISPATCH != '1'
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Compute the month's insight
        if: env.SKIP_DISPATCH != '1'
        run: |
          set -e
          node scripts/build-cost-index-dispatch.mjs --dry-run
          node scripts/build-cost-index-dispatch.mjs --json > /tmp/insight.json
          ASOF=$(node -e 'console.log(require("/tmp/insight.json").asOf)')
          echo "ASOF=$ASOF" >> "$GITHUB_ENV"
          echo "asOf: $ASOF"

      # Scheduled runs publish + send; manual dispatch only does so when dry-run=false.
      - name: Publish the dated dispatch
        if: ${{ env.SKIP_DISPATCH != '1' && (github.event_name == 'schedule' || github.event.inputs.dry-run == 'false') }}
        run: |
          set -e
          # Emit blog/cost-index-week-<asOf>/index.html from the measured index.
          # This also appends the longitudinal spine (data/cost-index-editions.json)
          # and writes the citable per-week snapshot (cost-index/week-<asOf>.json + .csv)
          # that the dispatch's Dataset JSON-LD and "Cite this" block link to.
          node scripts/build-cost-index-dispatch.mjs
          # Rebuild the edition archive page (reads the spine) and re-point the library
          # hero at the newest week — both must run here or those surfaces drift behind.
          node scripts/build-cost-index-archive.mjs
          node scripts/inject-library-cost-index-hero.mjs
          # Restore canonical nav, then register the post in the standard surfaces
          # (same scripts the deploy build runs — RSS, sitemap, blog index, glossary
          # backlinks). The Cloudflare build regenerates these anyway, but committing
          # them keeps git in sync and the gate green.
          node scripts/sync-includes.mjs
          node scripts/build-library-recent.mjs           || true
          # Card the post on /blog/ — the comment above always promised "blog
          # index" but the call was missing until 2026-07-06; every workflow-
          # published week needed a manual rerun to appear on the blog index.
          node scripts/build-blog-index.mjs               || true
          node scripts/wire-glossary-knit.mjs             || true
          node scripts/inject-glossary-article-backlinks.mjs || true
          node scripts/build-rss.mjs                       || true
          node scripts/build-sitemap.mjs                   || true
          node scripts/build-llms-txt.mjs                  || true
          # Gate the generated post — fail the run before committing if it's malformed.
          node scripts/check-article-graphics.mjs
          # Fact-gate the driver catalog + the optional "from the floor" note, so a
          # malformed driver entry or an untraceable number fails BEFORE publish.
          node scripts/check-cost-index-drivers.mjs
          node scripts/check-cost-index-editors-note.mjs
          # Scoped commit: only the post + its registration surfaces; discard the
          # incidental site-wide sync-includes sweep so the commit is exactly the post.
          git config user.name  "muntin-cost-index-bot"
          git config user.email "actions@users.noreply.github.com"
          # Stage per-pathspec: a single `git add` with one unmatched pathspec stages
          # NOTHING (git aborts the whole add), and `|| true` then swallows the error —
          # the generator writes the EN post only, so "es/blog/cost-index-week-*/"
          # never matches and silently voided the entire publish (refresh run #33,
          # 2026-07-06). Looping makes each path independent.
          for p in "blog/cost-index-week-${ASOF}/" "es/blog/cost-index-week-${ASOF}/" \
                   data/cost-index-editions.json data/cost-index-readings.prev.json \
                   cost-index/week-*.json cost-index/week-*.csv \
                   cost-index/weekly/ es/cost-index/weekly/ \
                   library/index.html es/library/index.html \
                   blog/index.html es/blog/index.html \
                   feed.xml es/feed.xml sitemap.xml \
                   llms.txt es/llms.txt data/library-tags.json \
                   glossary/ es/glossary/; do
            git add "$p" 2>/dev/null || echo "dispatch stage: no match for $p (skipped)"
          done
          git checkout -- . 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No dispatch change this week — nothing to commit."
          else
            git commit -m "data(cost-index): weekly dispatch ${ASOF}"
            git push
          fi

      - name: Broadcast the monthly email
        if: ${{ env.SKIP_DISPATCH != '1' && (github.event_name == 'schedule' || github.event.inputs.dry-run == 'false') }}
        env:
          BROADCAST_SECRET: ${{ secrets.COST_INDEX_BROADCAST_SECRET }}
        run: |
          set -e
          if [ -z "$BROADCAST_SECRET" ]; then
            echo "COST_INDEX_BROADCAST_SECRET not set — skipping send (nothing emailed)."
            exit 0
          fi
          # postUrl points subscribers at the dated dispatch just published above.
          node -e 'const i=require("/tmp/insight.json"); i.postUrl="https://muntin.digital/blog/cost-index-week-"+i.asOf+"/"; require("fs").writeFileSync("/tmp/payload.json", JSON.stringify(i));'
          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
            -X POST 'https://muntin.digital/api/admin/cost-index-broadcast' \
            -H "Authorization: Bearer $BROADCAST_SECRET" \
            -H 'Content-Type: application/json' \
            --data @/tmp/payload.json)
          echo "broadcast HTTP $code"; cat /tmp/resp.json; echo
          # 2xx (sent or already-sent) is success; anything else fails the run.
          case "$code" in 2*) exit 0 ;; *) echo "broadcast failed"; exit 1 ;; esac
