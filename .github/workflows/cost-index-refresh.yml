# Cost Index refresh — the freshness heartbeat. Monday/Wednesday/Friday.
# (Daily until the 2026-07-06 cadence pivot, founder call.)
#
# Every Mon/Wed/Fri 13:00 UTC: fetch the live public sources (USDA AMS/LMR, BLS,
# FRED, EIA) for verified ingredients, compose the honest artifact, vendor it
# through the build's own fact gate, reconcile each shown trend to its curve,
# rebuild the browser seed + cost-index + ingredient-yield pages, gate, commit.
#
# Why MON/WED/FRI: the dollar LEVEL for produce (USDA AMS terminals) and
# beef/pork (LMR cutout) updates business-daily, so an every-other-business-day
# sample keeps the shown level <=2 days old on weekdays (<=3 across a weekend)
# at half the run volume of daily. The monthly/weekly legs (BLS PPI, EIA, FRED
# diesel) just contribute their latest each run. The sparkline is a per-fetch
# windowed source curve, so cadence doesn't change it; the EMAIL is monthly
# (first Tuesday — separate dispatch workflow).
#
# Honest-failure posture (matches the engine):
#   - No API keys configured  -> log + exit 0 (never a red X before the
#     founder sets secrets; nothing is invented).
#   - Live fetch composes 0 points -> fetch script REFUSES to write the
#     artifact; the committed last-good data/cost-index.json stays.
#   - Gates failing -> job fails, nothing is committed. A stale-but-true
#     index beats a fresh-but-wrong one.
#   - A persistent stall (data older than the heartbeat threshold despite keys)
#     fails the run red -> GitHub emails the founder.
#
# Founder setup (repo Settings -> Secrets and variables -> Actions):
#   FRED_KEY, BLS_KEY, AMS_KEY  (required for --live)
#   LMR_KEY, EIA_KEY            (optional)

name: Cost Index refresh (Mon/Wed/Fri)

on:
  schedule:
    - cron: "0 13 * * 1,3,5" # Mon/Wed/Fri 13:00 UTC (cadence pivot 2026-07-06)
  workflow_dispatch:

permissions:
  contents: write # commits the refreshed data + rebuilt pages

concurrency:
  group: cost-index-refresh-${{ github.ref }}
  cancel-in-progress: false # never interrupt a run mid-commit

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check keys are configured
        id: keys
        env:
          FRED_KEY: ${{ secrets.FRED_KEY }}
          BLS_KEY: ${{ secrets.BLS_KEY }}
          AMS_KEY: ${{ secrets.AMS_KEY }}
        run: |
          if [ -z "$FRED_KEY" ] && [ -z "$BLS_KEY" ] && [ -z "$AMS_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No source API keys configured — skipping refresh (set FRED_KEY/BLS_KEY/AMS_KEY repo secrets to light the heartbeat)."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Live fetch -> artifact
        if: steps.keys.outputs.configured == 'true'
        env:
          FRED_KEY: ${{ secrets.FRED_KEY }}
          BLS_KEY: ${{ secrets.BLS_KEY }}
          AMS_KEY: ${{ secrets.AMS_KEY }}
          LMR_KEY: ${{ secrets.LMR_KEY }}
          EIA_KEY: ${{ secrets.EIA_KEY }}
        run: node scripts/fetch-cost-index-sources.mjs --live --out /tmp/ci-artifact.json

      - name: Build vendored cost-index from artifact
        if: steps.keys.outputs.configured == 'true'
        run: |
          if [ ! -f /tmp/ci-artifact.json ]; then
            echo "No artifact written (0 points composed) — keeping last-good data; see fetch log."
            exit 0
          fi
          # Vendor into data/cost-index.json — fact-gated inside build-cost-index.mjs.
          node scripts/build-cost-index.mjs --artifact /tmp/ci-artifact.json
          # Align each SHOWN trend % to the curve its sparkline draws — the blended
          # trend off a fresh fetch won't equal the windowed primary curve, and the
          # shown % must describe the shown line (the trend↔curve honesty invariant).
          node scripts/reconcile-cost-index-trends.mjs
          # Rebuild the browser seed (data/cost-index.js) so Cost Pulse / the
          # client read the fresh numbers — not just the server-rendered pages.
          node scripts/build-cost-index-seed.mjs
          # Rebuild the Vendor Benchmark ingredient-picker manifest (data/cost-index-picker.js).
          # It's a pure function of the seed's pickable subset, so a refresh that adds or
          # drops an ingredient (or flips a firm-$ reference) leaves it stale and trips
          # check-cost-index-picker on the next PR unless it's rewritten here.
          node scripts/build-cost-index-picker.mjs
          # Regenerate the coverage/health matrix + seasonal baseline — both are
          # pure functions of the freshly vendored data/cost-index.json and are
          # --check-gated in CI, so they must be rewritten here or the next PR
          # trips the stale gate.
          node scripts/build-cost-index-health.mjs
          node scripts/build-seasonality.mjs
          # Re-detect notable price events (biggest sustained moves off local normal
          # + duration / own-season / co-movement) from the deep history. Pure math,
          # --check-gated in CI; the per-ingredient pages read it at BUILD time, so it
          # must be rewritten here before the pages render.
          node scripts/build-cost-index-events.mjs
          # Rebuild the Vendor Benchmark market-context seed (volatility, current-vs-normal
          # state, most recent documented event per ingredient). Reads the fresh index/history/
          # events/registry; --check-gated in CI.
          node scripts/build-cost-index-context.mjs
          # Rebuild the pure-data/ committed artifacts whose inputs are all
          # final at this point (cost-index.json + seed + deep history +
          # seasonality) — each is --check-gated in check-all, so any one left
          # out drifts stale the moment the read above commits (the 2026-07-06
          # gap: these gates landed while the refresh was down, so no run ever
          # exercised them). The provenance/audit/calibration-report rebuilds
          # run AFTER page generation below — provenance reads the regenerated
          # cost-index/index.json aggregate (the 2026-07-06 first-recovery-run
          # ordering failure: built here, it derives from the stale aggregate
          # and its own gate correctly refuses the commit).
          node scripts/build-cost-lockfloat.mjs
          node scripts/backtest-cost-forecast.mjs
          # Anomaly log (Hampel/Pettitt over deep history) — upstream of the
          # anomaly open-data reshape below; same posture as lockfloat/backtest.
          node scripts/build-cost-anomaly-log.mjs
          # Re-render hub / per-ingredient / lab pages.
          node scripts/build-cost-index-pages.mjs
          # Re-inject the "Where it comes from" + food-safety recall sections —
          # the page builder overwrites ingredient HTML wholesale and does not
          # emit these (owned by the injectors / lib mirrors). Without this the
          # next refresh strips them and the check-all supply/recall sync gates
          # fail on the committed pages.
          node scripts/inject-supply-picture.mjs
          node scripts/inject-ingredient-recalls.mjs
          # Re-stamp the /about/ live basket read (same data the hub composite
          # features) so the pledge "the numbers I check on my shifts" never
          # freezes at last build. Reads data/cost-index.json; EN + ES.
          node scripts/inject-about-cost-read.mjs
          # Re-render the ingredient-yield library pages — their market-read block
          # (live edible-unit cost, measured band, percentile, buy/hold verdict)
          # reads data/cost-index.json at BUILD time, so without this they freeze
          # at last build while the hub refreshes. Current information everywhere.
          node scripts/build-ingredient-yield-pages.mjs
          # Open-data reshapes (CC0/CC-BY) — re-derive the public cost-index/*.{json,csv}
          # datasets from the freshly regenerated sources (seasonality, events, lockfloat,
          # anomaly log) so the /open downloads never lag the index. Pure data files, no
          # nav. --check-gated in the Fact + calibration gates step below.
          node scripts/build-seasonality-open-data.mjs
          node scripts/build-events-open-data.mjs
          node scripts/build-lockfloat-open-data.mjs
          node scripts/build-anomaly-open-data.mjs
          node scripts/build-yields-open-data.mjs
          # Restore canonical nav — the page builders emit skeleton include
          # sentinels; without this the committed pages would ship stripped nav.
          node scripts/sync-includes.mjs
          # Re-apply the deferred-script loader to the freshly generated pages, then
          # refresh the sitemap (both required after any page generation).
          node scripts/inject-lazy-script-loader.mjs
          node scripts/build-sitemap.mjs
          # Stamp the seed's generatedAt into the Dataset / DataCatalog JSON-LD
          # dateModified (methodology EN+ES + hub) so the machine-readable
          # freshness signal tracks each measured read. In place, idempotent.
          node scripts/inject-cost-index-dataset-date.mjs
          # Post-page derived artifacts, in dependency order. Provenance reads
          # the freshly regenerated cost-index/index.json aggregate and stamps
          # the source-registry table into the sources pages (sentinel region,
          # so the include/loader re-stamps above don't disturb it); the audit
          # reconciles against it; the calibration report is rebuilt before its
          # methodology-page sentinel injection, which — like the dataset-date
          # stamp — must run after page generation.
          node scripts/build-cost-index-provenance.mjs
          node scripts/build-cost-index-audit.mjs
          node scripts/build-cost-index-calibration-report.mjs
          node scripts/inject-cost-index-calibration.mjs
          # Second artifact family the 2026-07-06 recovery surfaced (the deploy
          # build regenerates the idem class itself but NOT these; committed
          # copies must stay in sync or the Workers deploy check goes red):
          # per-ingredient embeds, the public feed, the revisions log, the
          # methodology reproduce stamp, both confidence reports, and the
          # speakable stamps on the regenerated pages.
          node scripts/build-cost-index-embed.mjs
          node scripts/build-cost-index-feed.mjs
          node scripts/build-cost-revisions.mjs
          node scripts/build-cost-index-reproduce.mjs
          node scripts/build-cost-confidence-calibration.mjs
          node scripts/build-cost-confidence-shadow.mjs
          node scripts/inject-cost-index-speakable.mjs
          # The published one-print outlook (2026-07-09): data/cost-outlook.json
          # is a pure function of cost-pressure + the forecast backtest +
          # seasonality + the basket weights. The backtest and seasonality were
          # just rebuilt above, so the outlook must re-derive here or it drifts
          # stale the moment this read commits (it sat at 2026-06-08 for a
          # month because no run rebuilt it). The monthly edition's
          # Looking-ahead block renders its h=1 weighted tilt (ADR-010 §6.4
          # extension, ratified 2026-07-06) — --check-gated below like the
          # rest of this family.
          node scripts/build-cost-outlook.mjs
          # Re-stamp the calibration sentinels LAST (2026-07-09): the first MWF
          # cron (07-08) proved that on a fresh-data run a later rebuild in this
          # chain can leave the stamp stale relative to the final page state —
          # the gates step then correctly refuses the commit and the heartbeat
          # stalls. Idempotent; the --check in the gates step stays the verifier.
          node scripts/inject-cost-index-calibration.mjs
          # Golden render of the dispatch email (data/email-preview/) — the
          # committed, human-readable copy of exactly what subscribers would
          # get from this data. Sync-gated below; content-gated in check-all.
          node scripts/build-cost-index-email-preview.mjs

      - name: Fact + calibration gates
        if: steps.keys.outputs.configured == 'true'
        run: |
          node scripts/check-cost-index-sync.mjs
          node scripts/check-cost-index-calibration.mjs
          # A refresh that drops an ingredient (its points all aged out) would
          # orphan that ingredient's published EN+ES page — frozen price, still
          # in the sitemap, never regenerated again. Catch it BEFORE the commit,
          # not later in check-all on somebody's unrelated PR.
          # Roster of feeds that stopped updating, with a countdown to the cliff
          # where the builder drops them. Warn-only: a dead upstream must not
          # block a refresh that is otherwise carrying good data forward.
          node scripts/check-cost-index-series-freshness.mjs
          # A fresh fetch must never publish a trend % that contradicts its own
          # sparkline (the unwindowed-index-source bug). Fail the run before commit.
          node scripts/reconcile-cost-index-trends.mjs --check
          # Every derived artifact rebuilt above must re-derive byte-identical —
          # a drift here means the build order broke, not the data. Fail pre-commit.
          node scripts/build-cost-index-provenance.mjs --check
          node scripts/build-cost-index-audit.mjs --check
          node scripts/build-cost-lockfloat.mjs --check
          node scripts/build-cost-anomaly-log.mjs --check
          node scripts/build-cost-index-calibration-report.mjs --check
          node scripts/backtest-cost-forecast.mjs --check
          node scripts/inject-cost-index-calibration.mjs --check
          node scripts/build-cost-index-embed.mjs --check
          node scripts/build-cost-index-feed.mjs --check
          node scripts/inject-about-cost-read.mjs --check
          node scripts/inject-supply-picture.mjs --check
          node scripts/inject-ingredient-recalls.mjs --check
          node scripts/check-cost-index-confidence.mjs
          node scripts/build-cost-revisions.mjs --check
          node scripts/build-cost-index-reproduce.mjs --check
          node scripts/build-cost-confidence-calibration.mjs --check
          node scripts/build-cost-confidence-shadow.mjs --check
          node scripts/build-cost-outlook.mjs --check
          node scripts/inject-cost-index-speakable.mjs --check
          node scripts/build-cost-index-email-preview.mjs --check
          # Open-data reshapes rebuilt above — same pre-commit drift gate as the
          # other derived families (a skipped reshape must not reach commit).
          node scripts/build-seasonality-open-data.mjs --check
          node scripts/build-events-open-data.mjs --check
          node scripts/build-lockfloat-open-data.mjs --check
          node scripts/build-anomaly-open-data.mjs --check
          node scripts/build-yields-open-data.mjs --check
          # The emailed render itself must pass its content rules (banned
          # techniques, numeric parity, confidence language, sign agreement,
          # quiet-lead determinism) BEFORE the data that produces it commits.
          node scripts/check-cost-index-email.mjs
          # The honesty gates that ship with the fresh surfaces: no non-dollar
          # basis mislabeled as a $ level, no below-bar ingredient in the seed,
          # every rendered seasonal band re-derived, and the published 80% band
          # + trend-skill claims re-verified against realized history. If the
          # fresh read breaks an earned claim, the run fails red and nothing
          # commits — a stale-but-true index beats a fresh-but-wrong one.
          node scripts/check-cost-index-basis-leak.mjs
          node scripts/check-shippable-bar.mjs
          node scripts/check-cost-index-seasonal.mjs
          node scripts/check-band-coverage.mjs
          node scripts/check-trend-skill.mjs

      - name: Commit the measured read
        id: commit
        if: steps.keys.outputs.configured == 'true'
        run: |
          git config user.name "muntin-cost-index-bot"
          git config user.email "actions@users.noreply.github.com"
          # Stage ONLY the measured data + the cost-index surfaces, then discard
          # the incidental site-wide nav re-stamp from sync-includes, so the commit
          # is always exactly the dated read — never a surprise sweep.
          # Stage the measured data, the derived matrices (health + seasonality —
          # both are pure functions of cost-index.json and are --check-gated, so
          # leaving them out lets them drift stale until the next full build), and
          # the cost-index surfaces. Then discard the incidental site-wide nav
          # re-stamp from sync-includes, so the commit is always exactly the read.
          # The revisions ledger travels as a PAIR: the public log (data/cost-revisions.json
          # + cost-index/revisions.json, staged below) AND its diff-basis vintage
          # (data/cost-index-readings.prev.json). Staging the log alone rolled it forward but
          # then the `git checkout -- .` below discarded the freshly-rolled prev, so every
          # later checkout (the Workers deploy, any PR's check-all) saw prev != current and
          # the revisions --check went red. Stage both so prev never drifts again.
          # data/cost-index-retired.json travels WITH data/cost-index.json. It is the
          # other half of the same write: cost-index.json is where an ingredient stops
          # being, and the archive is where it goes (ADR-021). Committing one without
          # the other publishes terminal pages whose evidence is missing, and
          # check-cost-index-orphans.mjs then correctly reports them as orphans on the
          # next run — a red nobody can clear, caused by the staging list, not the data.
          # `git checkout -- .` below cannot rescue it either: the file is untracked on
          # the run that creates it, so an omission here loses it silently.
          git add data/cost-index.json data/cost-index-retired.json data/cost-index.js \
            data/cost-index-health.json data/seasonality.json \
            data/cost-lockfloat.json data/cost-lockfloat.js \
            data/cost-anomaly-log.json \
            data/cost-index-audit.json data/cost-index-calibration-report.json \
            data/cost-forecast-backtest.json data/cost-outlook.json \
            data/cost-revisions.json data/cost-index-readings.prev.json \
            data/cost-confidence-calibration.json \
            data/cost-confidence-shadow.json data/email-preview/ \
            cost-index/ es/cost-index/ \
            library/ingredient-yields/ es/library/ingredient-yields/ sitemap.xml
          git checkout -- . 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data change today — nothing to commit."
            exit 0
          fi
          git commit -m "data(cost-index): measured read $(date -u +%F)"
          git push

      - name: Publish the dispatch if it has fallen behind the data
        if: steps.keys.outputs.configured == 'true'
        # MANUAL AUTHORSHIP (founder call 2026-07-09): the monthly dispatch is
        # hand-written — this workflow must never auto-generate a post. This
        # step is now purely the REMINDER: when the published dispatch trails
        # the data by more than the monthly threshold, fail the run red so
        # GitHub emails the founder "time to write the monthly dispatch."
        # Nothing is generated, published, or emailed here.
        run: |
          if node scripts/check-cost-index-dispatch-fresh.mjs; then
            echo "Dispatch is current — nothing to do."
          else
            echo "::error::The Cost Index data is more than a month ahead of the last published dispatch — time to hand-write the monthly edition (see docs/plans/monthly-dispatch-site-edition.md)."
            exit 1
          fi
      - name: Orphaned-page alarm
        # POST-COMMIT ON PURPOSE. If this run dropped an ingredient whose points
        # all aged out, that ingredient's published EN+ES pages are now orphaned
        # and somebody has to decide (re-source, or retire deliberately). But the
        # condition is CREATED by the refresh and cannot be healed by it, so
        # blocking the commit would discard a correct, freshly measured read for
        # ~99 healthy ingredients in order to protect one stale page — and every
        # subsequent Mon/Wed/Fri run would fail at the same line until a human
        # acted. The data is right; only the page inventory is stale. So: land
        # the good read, then go red and email the founder, exactly like the
        # heartbeat alarm below. check-all.mjs keeps this gate HARD, where a
        # human is present to act on it.
        #
        # UPDATE 2026-07-31 (ADR-021): "cannot be healed by it" is now only half
        # true. The refresh archives the dropped ingredient's last-good state and
        # the page build above renders it as a terminal page in the same run, so
        # an ordinary retirement resolves before this step and stays green. What
        # still reaches here is a retirement that could NOT be rendered — a slug
        # missing its label or its ING_META entry — which is exactly the case
        # that needs a human. Keep the step: it is now a narrower alarm, not a
        # standing one.
        # Tied to the commit step's OUTCOME: when gates fail the commit is
        # skipped and the working tree can disagree with published state —
        # running the orphan check there would false-alarm about a file that
        # was thrown away. `always()` is kept alongside it so that a failure in
        # a step BETWEEN the commit and here (the dispatch-freshness check)
        # cannot silence a real orphan report.
        if: always() && steps.commit.outcome == 'success'
        run: node scripts/check-cost-index-orphans.mjs

      - name: Heartbeat freshness check
        if: steps.keys.outputs.configured == 'true'
        # Keys are set, so the index IS expected to be current. On the Mon/Wed/Fri
        # cadence (2026-07-06 pivot) the freshest read is <=2 days old on weekdays
        # and <=3 across a weekend; 6 days tolerates one holiday-skipped run
        # (Fri holiday -> Wed is 5d) but alarms on a real stall (keys lapsed /
        # sources down) — fail so the scheduled run goes red and GitHub emails
        # the founder. The alert the last-good posture swallows.
        env:
          COST_INDEX_MAX_AGE_DAYS: "6"
        run: node scripts/check-cost-index-freshness.mjs --check
