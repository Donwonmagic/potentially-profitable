    <form id="sheet-fields" class="sheet-form" autocomplete="off" novalidate>
      <fieldset>
        <legend>Header</legend>
        <label><span><span>Restaurant name</span></span><input type="text" name="name" data-context-key="restaurantProfile.name" /></label>
        <label><span><span>GBP listing URL (business.google.com/…)</span></span><input type="url" name="gbp_url" /></label>
        <label><span><span>Audited by + date</span></span><input type="text" name="auditor" /></label>
      </fieldset>

      <fieldset>
        <legend>Identity (NAP — must match across every citation)</legend>
        <label><input type="checkbox" name="i_name" /><span><span>Business name matches the door sign exactly (no city/keyword tail)</span></span></label>
        <label><input type="checkbox" name="i_addr" /><span><span>Address matches the door — same suite, same abbreviations</span></span></label>
        <label><input type="checkbox" name="i_phone" /><span><span>Phone is the one that's answered (not a forwarding number)</span></span></label>
        <label><input type="checkbox" name="i_site" /><span><span>Website URL points at the deployed site (not the Squarespace draft, not the old domain)</span></span></label>
      </fieldset>

      <fieldset>
        <legend>Hours + special hours</legend>
        <label><input type="checkbox" name="h_weekly" /><span><span>Weekly hours match the course-hours sheet exactly</span></span></label>
        <label><input type="checkbox" name="h_special" /><span><span>Special hours set for the next 60 days of holidays</span></span></label>
        <label><input type="checkbox" name="h_temp" /><span><span>No stale 'Temporarily closed' or 'Permanently closed' flag from a pandemic-era edit</span></span></label>
      </fieldset>

      <fieldset>
        <legend>Categories + attributes</legend>
        <label><input type="checkbox" name="c_primary" /><span><span>Primary category is the most-specific match Google offers (e.g., 'Mexican restaurant' not 'Restaurant')</span></span></label>
        <label><span><span>Primary category chosen</span></span><input type="text" name="c_primary_value" /></label>
        <label><input type="checkbox" name="c_secondary" /><span><span>1–3 secondary categories chosen (don't overdo it)</span></span></label>
        <label><input type="checkbox" name="a_dining" /><span><span>Dine-in / takeout / delivery attributes set correctly</span></span></label>
        <label><input type="checkbox" name="a_access" /><span><span>Accessibility attributes set (wheelchair, etc.)</span></span></label>
        <label><input type="checkbox" name="a_amenities" /><span><span>Amenities set (outdoor seating, wifi, parking)</span></span></label>
      </fieldset>

      <fieldset>
        <legend>Content — photos + posts + description</legend>
        <label><input type="checkbox" name="p_cover" /><span><span>Cover photo set + reflects current season</span></span></label>
        <label><input type="checkbox" name="p_logo" /><span><span>Logo photo set</span></span></label>
        <label><input type="checkbox" name="p_interior" /><span><span>3+ interior photos (recent)</span></span></label>
        <label><input type="checkbox" name="p_food" /><span><span>5+ food photos from the menu shortlist</span></span></label>
        <label><input type="checkbox" name="d_desc" /><span><span>Business description filled — anchored to the L3 one-promise + L4 customer paragraph</span></span></label>
      </fieldset>

      <fieldset>
        <legend>Reviews + Q&amp;A</legend>
        <label><input type="checkbox" name="r_recent" /><span><span>All reviews from the last 30 days have a response</span></span></label>
        <label><input type="checkbox" name="r_bad_pinned" /><span><span>Any bad review has the name-own-repair response from the L13 template</span></span></label>
        <label><input type="checkbox" name="qa_seeded" /><span><span>Q&amp;A seeded with the top 3 questions the host stand actually gets</span></span></label>
      </fieldset>

      <fieldset>
        <legend>Menu + services</legend>
        <label><input type="checkbox" name="m_link" /><span><span>Menu link points at the deployed menu.html (or the canonical PDF)</span></span></label>
        <label><input type="checkbox" name="m_dishes" /><span><span>3+ popular dishes added via the GBP menu editor (drives 'serves X' searches)</span></span></label>
        <label><input type="checkbox" name="s_services" /><span><span>Services list filled if applicable (catering, private events, gift cards)</span></span></label>
      </fieldset>

      <fieldset>
        <legend>Issues found / actions</legend>
        <label><span><span>What needs fixing this week</span></span><textarea name="actions" rows="4"></textarea></label>
      </fieldset>
    </form>

    <script>
      (function () {
        if (window.SheetPage) window.SheetPage.register({ slug: 'course-gbp-checklist' });
      })();
    </script>
