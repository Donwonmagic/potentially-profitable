<script>
  /* Platform-aware kbd hint. Default markup is Ctrl+K (PC); flip to ⌘K on
     Apple devices. Runs early in <body> so the swap is essentially
     invisible — script tags execute synchronously when the parser hits
     them, before .nav-search-kbd renders below. CSS in site-core.css
     conditions on <html data-platform="mac">. */
  if (/Mac|iPhone|iPad|iPod/i.test(navigator.userAgent || navigator.platform || '')) {
    document.documentElement.dataset.platform = 'mac';
  }
</script>

  window.__i18n=Object.assign(window.__i18n||{},{{I18N_JSON}});</script>

  <!-- Mega-menu controller retired in Phase 7: Biblioteca is now a
       single link to /es/library/ (the canonical three-doors hub IS
       the menu). Las reglas CSS de .nav-library-* permanecen para
       reusar el patrón si vuelve un mega-menú en el futuro. -->

  <!-- Phase 2 (Workshop) — toggle del estado de auth para el nav.
       Llama a /api/auth/me y revela el enlace "Acceder" o "El Taller"
       según la respuesta. Ambos enlaces empiezan ocultos para que un
       visitante anónimo sin JS no vea ninguno (la biblioteca y las
       herramientas funcionan completas sin acceso, así que la
       affordance ausente es aceptable). -->
  <script>
    (function () {
      var signin   = document.querySelectorAll('.js-nav-signin');
      var workshop = document.querySelectorAll('.js-nav-workshop');
      if (!signin.length && !workshop.length) return;
      var show = function (nodes) { nodes.forEach(function (n) { n.hidden = false; }); };
      fetch('/api/auth/me', { credentials: 'same-origin' })
        .then(function (r) {
          if (r.status === 200) {
            show(workshop);
            fetch('/api/workbench/count', { credentials: 'same-origin' })
              .then(function (r2) { return r2.ok ? r2.json() : null; })
              .then(function (j) {
                if (!j || typeof j.count !== 'number' || j.count <= 0) return;
                workshop.forEach(function (n) {
                  if (n.querySelector('.nav-workshop-count')) return;
                  var b = document.createElement('span');
                  b.className = 'nav-workshop-count';
                  b.textContent = ' (' + j.count + ')';
                  n.appendChild(b);
                });
              })
              .catch(function () {});
            return;
          }
          show(signin);
        })
        .catch(function () { show(signin); });
    })();
  </script>
