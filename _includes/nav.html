  <!-- Phase 2 (Workshop) — auth-state toggle for the nav.
       Calls /api/auth/me and reveals either the "Sign in" or
       "Workshop" link based on the response. Both links ship hidden
       so anonymous visitors with JS disabled see neither (the
       library + tools work fully without sign-in, so the missing
       affordance is acceptable). The script runs once, fire-and-
       forget; no observable side effects on a 401. -->
  <script>
    /* Phase 3C-perf — deferred via requestIdleCallback so the
       /api/auth/me round-trip stays off the critical path. Both
       .js-nav-signin / .js-nav-workshop ship hidden, so a one-frame
       delay before the correct affordance reveals is invisible. */
    (window.requestIdleCallback || function (cb) { return setTimeout(cb, 200); })(function () {
      var signin   = document.querySelectorAll('.js-nav-signin');
      var workshop = document.querySelectorAll('.js-nav-workshop');
      if (!signin.length && !workshop.length) return;
      var show = function (nodes) { nodes.forEach(function (n) { n.hidden = false; }); };
      fetch('/api/auth/me', { credentials: 'same-origin' })
        .then(function (r) {
          if (r.status === 200) {
            show(workshop);
            // Phase G.10 — append (N) badge with the user's save count.
            fetch('/api/workbench/count', { credentials: 'same-origin' })
              .then(function (r2) { return r2.ok ? r2.json() : null; })
              .then(function (j) {
                if (!j || typeof j.count !== 'number' || j.count <= 0) return;
                workshop.forEach(function (n) {
                  if (n.querySelector('.nav-workshop-count')) return;
                  var b = document.createElement('span');
                  b.className = 'nav-workshop-count';
                  b.textContent = ' (' + j.count + ')';
                  n.appendChild(b);
                });
              })
              .catch(function () { /* silent */ });
            // Course progress dot — appended after the workshop link
            // when the operator is mid-bootcamp (> 0 but < 16 lessons
            // done). Decorative + aria-hidden; the operator can still
            // click the workshop link to see the canonical count.
            fetch('/api/course/progress', { credentials: 'same-origin' })
              .then(function (r3) { return r3.ok ? r3.json() : null; })
              .then(function (j) {
                if (!j || !j.progress || !Array.isArray(j.progress.completed)) return;
                var n = j.progress.completed.length;
                if (n <= 0 || n >= 16) return;
                workshop.forEach(function (w) {
                  if (w.querySelector('.nav-course-dot')) return;
                  var dot = document.createElement('span');
                  dot.className = 'nav-course-dot';
                  dot.setAttribute('aria-hidden', 'true');
                  dot.title = 'Open the Doors — lesson ' + n + ' / 16';
                  dot.style.cssText = 'display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--teal);margin-left:6px;vertical-align:middle';
                  w.appendChild(dot);
                });
              })
              .catch(function () { /* silent — course endpoint optional */ });
            return;
          }
          show(signin);
        })
        .catch(function () { show(signin); });
    });
  </script>
