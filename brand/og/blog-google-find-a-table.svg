<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#FAF7F2"/>
  <rect x="0" y="0" width="6" height="630" fill="#C5A059"/>

  <text x="72" y="90" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#C5A059" letter-spacing="5">CONVERSION · GOOGLE</text>

  <text x="72" y="200" font-family="Fraunces, Georgia, serif" font-size="52" font-weight="500" fill="#14161A" letter-spacing="-2">How to stop losing</text>
  <text x="72" y="270" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="52" font-weight="400" fill="#1F4E5B" letter-spacing="-2">reservations to Google&rsquo;s</text>
  <text x="72" y="340" font-family="Fraunces, Georgia, serif" font-size="44" font-weight="500" fill="#14161A" letter-spacing="-1">&ldquo;find a table&rdquo; feature</text>

  <!-- Right: flow diagram showing bypass -->
  <g transform="translate(850, 140)">
    <!-- Top: Google Maps box -->
    <rect x="60" y="0" width="160" height="48" rx="8" fill="#FFFFFF" stroke="#E8E2D6" stroke-width="1.5"/>
    <text x="140" y="29" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#14161A">Google Maps</text>

    <!-- Left branch: find-a-table bypass -->
    <line x1="90" y1="48" x2="50" y2="95" stroke="#B8541A" stroke-width="2" stroke-dasharray="4,4"/>
    <rect x="0" y="96" width="130" height="44" rx="8" fill="#B8541A"/>
    <text x="65" y="122" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#FAF7F2" letter-spacing="1">OPENTABLE</text>

    <line x1="65" y1="140" x2="65" y2="180" stroke="#B8541A" stroke-width="2"/>
    <rect x="0" y="182" width="130" height="44" rx="8" fill="#B8541A"/>
    <text x="65" y="209" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#FAF7F2" letter-spacing="1">BOOKING</text>

    <!-- Dotted skip-your-site indicator -->
    <text x="65" y="248" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" font-style="italic" fill="#B8541A">(skips your site)</text>

    <!-- Right branch: the fix -->
    <line x1="190" y1="48" x2="215" y2="95" stroke="#1F4E5B" stroke-width="2"/>
    <rect x="150" y="96" width="130" height="44" rx="8" fill="#FFFFFF" stroke="#1F4E5B" stroke-width="2"/>
    <text x="215" y="122" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#1F4E5B" letter-spacing="1">YOUR SITE</text>

    <line x1="215" y1="140" x2="215" y2="180" stroke="#1F4E5B" stroke-width="2"/>
    <rect x="150" y="182" width="130" height="44" rx="8" fill="#1F4E5B"/>
    <text x="215" y="209" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#FAF7F2" letter-spacing="1">BOOKING</text>

    <text x="215" y="248" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" font-style="italic" fill="#1F4E5B">(you keep the guest)</text>
  </g>

  <text x="72" y="570" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B6B6B" letter-spacing="2">MUNTIN DIGITAL</text>
  <text x="1128" y="570" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#6B6B6B">muntin.digital/blog</text>
</svg>
