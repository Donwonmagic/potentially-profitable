<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow" cx="85%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#1F4E5B" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#14161A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#14161A"/>
  
    <defs>
      <pattern id="muntinField" x="0" y="0" width="140" height="140"
               patternUnits="userSpaceOnUse">
        <g transform="translate(18, 18)"
           fill="none" stroke="#FAF7F2" stroke-width="1.5"
           stroke-linecap="square" stroke-linejoin="miter">
          <rect x="0" y="0" width="104" height="104"/>
          <line x1="52" y1="0" x2="52" y2="104"/>
          <line x1="0" y1="36" x2="104" y2="36"/>
        </g>
      </pattern>
    </defs>
    <rect width="1200" height="630"
          fill="url(#muntinField)" opacity="0.05"/>
  
  <rect width="1200" height="630" fill="url(#glow)"/>

  
      <text x="780" y="200"
            font-family="Inter, Arial, sans-serif" font-size="12"
            font-weight="700" letter-spacing="3" fill="#FAF7F2" opacity="0.5">CITADAS EN TODA LA BIBLIOTECA</text>
      <text x="780" y="320"
            font-family="Fraunces, Georgia, serif" font-size="128"
            font-weight="500" letter-spacing="-4" fill="#C5A059">5</text>
      <text x="780" y="376"
            font-family="Inter, Arial, sans-serif" font-size="18"
            font-weight="500" fill="#FAF7F2" opacity="0.78">notas de investigación, cada una una fuente primaria</text>
    

  
    <g transform="translate(80, 102) scale(1.5)"
       fill="none" stroke="#C5A059" stroke-width="1.167"
       stroke-linecap="round" stroke-linejoin="round"
       color="#C5A059" opacity="0.78">
      <circle cx="12" cy="12" r="8"/>
             <line x1="12" y1="4" x2="12" y2="20"/>
             <line x1="4" y1="12" x2="20" y2="12"/>
             <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/>
    </g>
  
  <text x="136" y="128"
        font-family="Inter, Arial, sans-serif" font-size="14"
        font-weight="700" letter-spacing="5" fill="#FAF7F2" opacity="0.55">LA EVIDENCIA</text>

  <text x="80" y="232"
        font-family="Fraunces, Georgia, serif" font-size="76"
        font-weight="500" letter-spacing="-2" fill="#FAF7F2">Cada cifra,</text>
  <text x="80" y="312"
        font-family="Fraunces, Georgia, serif" font-style="italic"
        font-size="76" font-weight="400" letter-spacing="-2"
        fill="#FAF7F2" opacity="0.82">rastreada</text>
  <text x="80" y="392"
        font-family="Fraunces, Georgia, serif" font-size="76"
        font-weight="500" letter-spacing="-2" fill="#FAF7F2">a su fuente.</text>

  <text x="80" y="472"
        font-family="Inter, Arial, sans-serif" font-size="22"
        font-weight="400" fill="#FAF7F2" opacity="0.65">Notas breves de investigación detrás de los números que citamos.</text>

  
    <g transform="translate(80, 552)" fill="#FAF7F2" opacity="0.6">
      <circle cx="8" cy="8" r="8" fill="none" stroke="#FAF7F2" stroke-width="1"/>
      <text x="8" y="12" text-anchor="middle"
            font-family="Fraunces, Georgia, serif" font-style="italic"
            font-size="11" font-weight="500" fill="#FAF7F2">d</text>
    </g>
  
  
    <line x1="80" y1="584" x2="1120" y2="584"
          stroke="rgba(250,247,242,0.18)" stroke-width="1"/>
    <text x="80" y="614"
          font-family="Inter, Arial, sans-serif" font-size="14"
          font-weight="600" letter-spacing="2" fill="rgba(250,247,242,0.55)">MUNTIN DIGITAL</text>
    <text x="1120" y="614" text-anchor="end"
          font-family="Inter, Arial, sans-serif" font-size="14"
