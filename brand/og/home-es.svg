<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Spanish sibling of home.svg. Same dark premium palette, same
       muntin-window mark, same Fraunces/Inter typography stack — only
       the copy is translated. Meant to pair with es/index.html as
       og:image + twitter:image. -->
  <rect width="1200" height="630" fill="#14161A"/>
  <rect width="1200" height="630" fill="url(#glow-es)" opacity="0.6"/>
  <defs>
    <radialGradient id="glow-es" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1F4E5B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#14161A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Large window mark, left side -->
  <g transform="translate(72, 160)" stroke="#FAF7F2" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter" fill="none" opacity="0.15">
    <rect x="0" y="0" width="200" height="200"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="0" y1="70" x2="200" y2="70"/>
  </g>

  <!-- Eyebrow -->
  <text x="72" y="100" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#FAF7F2" letter-spacing="5" opacity="0.5">UN ESTUDIO DIGITAL DE UNA SOLA PERSONA</text>

  <!-- Main title -->
  <text x="320" y="265" font-family="Fraunces, Georgia, serif" font-size="88" font-weight="500" fill="#FAF7F2" letter-spacing="-3">Muntin Digital</text>

  <!-- Tagline -->
  <text x="320" y="340" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="40" font-weight="400" fill="#FAF7F2" opacity="0.7">La estructura da claridad.</text>

  <!-- Value prop -->
  <text x="320" y="420" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#FAF7F2" opacity="0.55">Diseño web, marca y redes sociales</text>
  <text x="320" y="448" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#FAF7F2" opacity="0.55">para restaurantes y negocios locales.</text>

  <!-- Bottom bar -->
  <rect y="580" width="1200" height="50" fill="#1F4E5B" opacity="0.3"/>
  <text x="72" y="612" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#FAF7F2" letter-spacing="2" opacity="0.7">SILVER SPRING, MD · SE HABLA ESPAÑOL</text>
  <text x="1128" y="612" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#FAF7F2" letter-spacing="1" opacity="0.7">muntin.digital/es</text>
</svg>
