<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#FAF7F2"/>

  <!-- Window mark, top-left -->
  <g transform="translate(72, 72)" stroke="#14161A" stroke-width="7" stroke-linecap="square" stroke-linejoin="miter" fill="none">
    <rect x="0" y="0" width="80" height="80"/>
    <line x1="40" y1="0" x2="40" y2="80"/>
    <line x1="0" y1="28" x2="80" y2="28"/>
  </g>

  <!-- Location tag, top-right -->
  <text x="1128" y="120" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#6B6B6B" letter-spacing="3">SILVER SPRING, MD</text>

  <!-- Main title -->
  <text x="600" y="320" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="112" font-weight="500" fill="#14161A" letter-spacing="-3">Muntin Digital</text>

  <!-- Italic subtitle -->
  <text x="600" y="400" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="50" font-weight="400" fill="#1F4E5B">Handled by one person.</text>

  <!-- Service strip -->
  <text x="600" y="490" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#6B6B6B" letter-spacing="3">WEB DESIGN  ·  BRANDING  ·  SOCIAL MEDIA</text>

  <!-- URL -->
  <text x="600" y="572" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#14161A" letter-spacing="1">muntin.digital</text>
</svg>
