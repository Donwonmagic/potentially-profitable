<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#F6F7F8"/>
  
    <defs>
      <pattern id="muntinField" x="0" y="0" width="140" height="140"
               patternUnits="userSpaceOnUse">
        <g transform="translate(18, 18)"
           fill="none" stroke="#16181D" stroke-width="1.5"
           stroke-linecap="square" stroke-linejoin="miter">
          <rect x="0" y="0" width="104" height="104"/>
          <line x1="52" y1="0" x2="52" y2="104"/>
          <line x1="0" y1="36" x2="104" y2="36"/>
        </g>
      </pattern>
    </defs>
    <rect width="1200" height="630"
          fill="url(#muntinField)" opacity="0.045"/>
  
  
  <defs>
    <radialGradient id="ghWarmSoft" cx="92%" cy="6%" r="64%">
      <stop offset="0%"  stop-color="#FFB020"  stop-opacity="0.13"/>
      <stop offset="52%" stop-color="#FF6B5C" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFB020" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#ghWarmSoft)"/>
  
    <rect x="0" y="0" width="12" height="252" fill="#FFB020"/>
    <rect x="0" y="252" width="12" height="378" fill="#FFB020" opacity="0.4"/>
  

  
    <g transform="translate(80, 78) scale(1.5)"
       fill="none" stroke="#FFB020" stroke-width="1.167"
       stroke-linecap="round" stroke-linejoin="round"
       color="#FFB020" opacity="0.85">
      <rect x="3.5" y="3.5" width="6" height="6" rx="0.5"/>
           <rect x="14.5" y="14.5" width="6" height="6" rx="0.5"/>
           <line x1="20" y1="4" x2="4" y2="20"/>
    </g>
  
  <text x="136" y="104"
        font-family="Inter, Arial, sans-serif" font-size="13"
        font-weight="700" letter-spacing="4" fill="#FFB020">NÚMEROS DEL RESTAURANTE</text>

  <text x="80" y="192"
        font-family="Fraunces, Georgia, serif" font-size="60"
        font-weight="500" letter-spacing="-2" fill="#16181D">Elasticidad</text>
  <text x="80" y="264"
        font-family="Fraunces, Georgia, serif" font-style="italic"
        font-size="60" font-weight="400" letter-spacing="-2"
        fill="#FFB020">de</text>
  <text x="80" y="328"
        font-family="Fraunces, Georgia, serif" font-size="60"
        font-weight="500" letter-spacing="-2" fill="#16181D">precio</text>

  <text x="80" y="408"
        font-family="Inter, Arial, sans-serif" font-size="20"
        font-weight="400" fill="#4A4F59"><tspan x="80" dy="0">Cuánto cambia el conteo de cubiertos cuando cambian los precios.</tspan></text>

  

  
    <g transform="translate(80, 552)" fill="#4A4F59" opacity="0.6">
      <circle cx="8" cy="8" r="8" fill="none" stroke="#4A4F59" stroke-width="1"/>
      <text x="8" y="12" text-anchor="middle"
            font-family="Fraunces, Georgia, serif" font-style="italic"
            font-size="11" font-weight="500" fill="#4A4F59">d</text>
    </g>
  
  
    <line x1="80" y1="584" x2="1120" y2="584"
          stroke="#E3E5E9" stroke-width="1"/>
    <text x="80" y="614"
          font-family="Inter, Arial, sans-serif" font-size="14"
          font-weight="600" letter-spacing="2" fill="#4A4F59">MUNTIN DIGITAL</text>
    <text x="1120" y="614" text-anchor="end"
          font-family="Inter, Arial, sans-serif" font-size="14"
          font-weight="600" letter-spacing="1" fill="#4A4F59">muntin.digital</text>
  
</svg>
