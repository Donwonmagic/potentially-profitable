<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#FAF7F2"/>
  <rect x="0" y="0" width="6" height="630" fill="#C28B2E"/>

  <text x="72" y="90" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#C28B2E" letter-spacing="5">COMPARISON · POS SYSTEMS</text>

  <text x="72" y="200" font-family="Fraunces, Georgia, serif" font-size="56" font-weight="500" fill="#14161A" letter-spacing="-2">Toast vs. Square</text>
  <text x="72" y="272" font-family="Fraunces, Georgia, serif" font-size="56" font-weight="500" fill="#14161A" letter-spacing="-2">vs. Clover</text>
  <text x="72" y="340" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="36" font-weight="400" fill="#1F4E5B">Which POS integrates best with your site?</text>

  <!-- Right: three POS indicator cards -->
  <g transform="translate(850, 150)">
    <rect x="0" y="0" width="280" height="56" rx="8" fill="#FFFFFF" stroke="#E8E2D6" stroke-width="1.5"/>
    <circle cx="32" cy="28" r="10" fill="#1f9d55"/>
    <text x="54" y="33" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#14161A">Square</text>
    <text x="240" y="33" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B6B6B">Best API</text>

    <rect x="0" y="68" width="280" height="56" rx="8" fill="#FFFFFF" stroke="#E8E2D6" stroke-width="1.5"/>
    <circle cx="32" cy="96" r="10" fill="#1F4E5B"/>
    <text x="54" y="101" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#14161A">Toast</text>
    <text x="240" y="101" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B6B6B">Restaurant-built</text>

    <rect x="0" y="136" width="280" height="56" rx="8" fill="#FFFFFF" stroke="#E8E2D6" stroke-width="1.5"/>
    <circle cx="32" cy="164" r="10" fill="#C28B2E"/>
    <text x="54" y="169" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#14161A">Clover</text>
    <text x="240" y="169" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B6B6B">Most hardware</text>
  </g>

  <text x="72" y="430" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#6B6B6B">Strengths, quiet limitations, and which one fits your restaurant.</text>

  <line x1="0" y1="590" x2="1200" y2="590" stroke="#E8E2D6" stroke-width="1"/>
  <text x="72" y="616" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B6B6B" letter-spacing="2">MUNTIN DIGITAL</text>
  <text x="1128" y="616" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B6B6B" letter-spacing="1">muntin.digital/blog</text>
</svg>
