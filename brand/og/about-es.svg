<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- About / Don's background. Warm cream on dark teal quarter to
       balance "human behind the studio" warmth with the brand's
       structural calm. Same Fraunces+Inter stack, same window mark. -->
  <rect width="1200" height="630" fill="#FAF7F2"/>
  <rect x="0" y="0" width="420" height="630" fill="#1F4E5B"/>
  <defs>
    <radialGradient id="aboutglow-es" cx="30%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FAF7F2" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#1F4E5B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="420" height="630" fill="url(#aboutglow-es)"/>

  <!-- Window mark inside the teal panel -->
  <g transform="translate(100, 180)" stroke="#FAF7F2" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter" fill="none" opacity="0.2">
    <rect x="0" y="0" width="240" height="240"/>
    <line x1="120" y1="0" x2="120" y2="240"/>
    <line x1="0" y1="85" x2="240" y2="85"/>
  </g>
  <text x="220" y="540" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#FAF7F2" letter-spacing="3" opacity="0.55">MUNTIN DIGITAL</text>

  <!-- Right content -->
  <text x="470" y="100" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F4E5B" letter-spacing="5">EL OPERADOR DETRÁS DEL ESTUDIO</text>

  <text x="470" y="210" font-family="Fraunces, Georgia, serif" font-size="72" font-weight="500" fill="#14161A" letter-spacing="-2">Don Goldstein</text>
  <text x="470" y="280" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="36" font-weight="400" fill="#1F4E5B" opacity="0.8">Una década en el salón.</text>
  <text x="470" y="320" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="36" font-weight="400" fill="#1F4E5B" opacity="0.8">Un estudio construido</text>
  <text x="470" y="360" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="36" font-weight="400" fill="#1F4E5B" opacity="0.8">a partir de lo que eso enseña.</text>

  <text x="470" y="440" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#6B6B6B">Dos restaurantes del DMV activos hoy · Silver Spring, MD</text>

  <line x1="0" y1="590" x2="1200" y2="590" stroke="#E8E2D6" stroke-width="1"/>
  <text x="470" y="616" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B6B6B" letter-spacing="2">SOBRE DON</text>
  <text x="1128" y="616" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B6B6B" letter-spacing="1">muntin.digital/es/about</text>
</svg>
