<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Three-panel split: Irish Inn green | Tacombi red | Off Day ink -->
  <rect x="0" width="400" height="630" fill="#123821"/>
  <rect x="400" width="400" height="630" fill="#E63226"/>
  <rect x="800" width="400" height="630" fill="#0D0C0A"/>

  <!-- Overlay for legibility -->
  <rect width="1200" height="630" fill="#14161A" opacity="0.55"/>

  <!-- Eyebrow -->
  <text x="72" y="100" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#FAF7F2" letter-spacing="5" opacity="0.6">MUNTIN DIGITAL · PROYECTOS</text>

  <!-- Title -->
  <text x="600" y="260" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="88" font-weight="500" fill="#FAF7F2" letter-spacing="-3">Proyectos</text>
  <text x="600" y="340" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="44" font-weight="400" fill="#FAF7F2" opacity="0.65">desde adentro.</text>

  <!-- Three project labels at bottom -->
  <text x="200" y="500" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#FAF7F2" letter-spacing="3" opacity="0.7">IRISH INN</text>
  <text x="600" y="500" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#FAF7F2" letter-spacing="3" opacity="0.7">TACOMBI</text>
  <text x="1000" y="500" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#FAF7F2" letter-spacing="3" opacity="0.7">OFF DAY</text>

  <!-- Bottom -->
  <text x="600" y="590" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#FAF7F2" letter-spacing="1" opacity="0.5">muntin.digital/es/work</text>
</svg>
