  <rect y="580" width="1200" height="50" fill="#1F4E5B" opacity="0.25"/>
  <text x="72" y="612" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#FAF7F2" letter-spacing="2" opacity="0.6">MUNTIN DIGITAL GLOSSARY</text>
  <text x="1128" y="612" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#FAF7F2" letter-spacing="1" opacity="0.7">muntin.digital/glossary</text>
