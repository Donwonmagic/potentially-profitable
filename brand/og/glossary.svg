<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#14161A"/>
  <defs>
    <radialGradient id="glossglow" cx="75%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#1F4E5B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#14161A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glossglow)" opacity="0.6"/>

  <text x="72" y="90" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#FAF7F2" letter-spacing="5" opacity="0.55">WEB GLOSSARY · PLAIN ENGLISH</text>

  <text x="72" y="210" font-family="Fraunces, Georgia, serif" font-size="72" font-weight="500" fill="#FAF7F2" letter-spacing="-2">Every term,</text>
  <text x="72" y="290" font-family="Fraunces, Georgia, serif" font-size="72" font-weight="500" fill="#FAF7F2" letter-spacing="-2">explained clearly.</text>
  <text x="72" y="355" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="32" font-weight="400" fill="#FAF7F2" opacity="0.65">For owners, not for developers.</text>

  <g transform="translate(720, 140)" font-family="Inter, Arial, sans-serif">
    <rect x="0" y="0" width="380" height="88" rx="10" fill="#FAF7F2" opacity="0.07"/>
    <text x="24" y="32" font-size="11" font-weight="700" fill="#FAF7F2" letter-spacing="3" opacity="0.55">SCHEMA</text>
    <text x="24" y="66" font-family="Fraunces, Georgia, serif" font-size="22" font-weight="500" fill="#FAF7F2">Data Google reads.</text>

    <rect x="0" y="108" width="380" height="88" rx="10" fill="#FAF7F2" opacity="0.07"/>
    <text x="24" y="140" font-size="11" font-weight="700" fill="#FAF7F2" letter-spacing="3" opacity="0.55">CORE WEB VITALS</text>
    <text x="24" y="174" font-family="Fraunces, Georgia, serif" font-size="22" font-weight="500" fill="#FAF7F2">Speed + stability.</text>

    <rect x="0" y="216" width="380" height="88" rx="10" fill="#FAF7F2" opacity="0.07"/>
    <text x="24" y="248" font-size="11" font-weight="700" fill="#FAF7F2" letter-spacing="3" opacity="0.55">OPEN GRAPH</text>
