    <text x="290" y="35" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B6B6B">100</text>
    <rect x="0" y="50" width="238" height="20" rx="3" fill="#1F4E5B" opacity="0.6"/>
    <text x="290" y="65" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B6B6B">85</text>
    <rect x="0" y="80" width="204" height="20" rx="3" fill="#C28B2E" opacity="0.6"/>
    <text x="290" y="95" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B6B6B">73</text>
    <rect x="0" y="110" width="140" height="20" rx="3" fill="#B8541A" opacity="0.6"/>
    <text x="290" y="125" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B6B6B">50</text>
    <rect x="0" y="140" width="131" height="20" rx="3" fill="#B8541A" opacity="0.8"/>
    <text x="290" y="155" font-family="Inter, Arial, sans-serif" font-size="13" fill="#B8541A" font-weight="700">47</text>
