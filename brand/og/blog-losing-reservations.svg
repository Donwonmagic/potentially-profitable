<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#FAF7F2"/>
  <rect x="0" y="0" width="6" height="630" fill="#B8541A"/>

  <text x="72" y="90" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#B8541A" letter-spacing="5">CONVERSION · RESERVATIONS</text>

  <text x="72" y="200" font-family="Fraunces, Georgia, serif" font-size="52" font-weight="500" fill="#14161A" letter-spacing="-2">Why Your Restaurant</text>
  <text x="72" y="268" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="52" font-weight="400" fill="#1F4E5B" letter-spacing="-2">Loses Reservations</text>
  <text x="72" y="330" font-family="Fraunces, Georgia, serif" font-size="44" font-weight="500" fill="#14161A" letter-spacing="-1">Every Night</text>

