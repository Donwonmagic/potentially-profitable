<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#FAF7F2"/>

  <!-- Window mark top-left -->
  <g transform="translate(72, 72)" stroke="#14161A" stroke-width="7" stroke-linecap="square" stroke-linejoin="miter" fill="none">
    <rect x="0" y="0" width="60" height="60"/>
    <line x1="30" y1="0" x2="30" y2="60"/>
    <line x1="0" y1="22" x2="60" y2="22"/>
  </g>

  <!-- Eyebrow top-right -->
  <text x="1128" y="108" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B6B6B" letter-spacing="4">MUNTIN DIGITAL · WRITING</text>

  <!-- Mini funnel illustration, left side -->
  <g transform="translate(100, 210)">
    <rect x="0"  y="0"   width="340" height="20" rx="3" fill="#1F4E5B"/>
    <rect x="0"  y="30"  width="289" height="20" rx="3" fill="#1F4E5B"/>
    <rect x="289" y="30" width="51"  height="20" rx="3" fill="#B8541A"/>
    <rect x="0"  y="60"  width="261" height="20" rx="3" fill="#1F4E5B"/>
    <rect x="261" y="60" width="27"  height="20" rx="3" fill="#B8541A"/>
    <rect x="0"  y="90"  width="248" height="20" rx="3" fill="#1F4E5B"/>
    <rect x="248" y="90" width="13"  height="20" rx="3" fill="#B8541A"/>
    <rect x="0"  y="120" width="214" height="20" rx="3" fill="#1F4E5B"/>
    <rect x="214" y="120" width="34" height="20" rx="3" fill="#B8541A"/>
    <rect x="0"  y="150" width="170" height="20" rx="3" fill="#1F4E5B"/>
    <rect x="170" y="150" width="44" height="20" rx="3" fill="#B8541A"/>
    <rect x="0"  y="180" width="160" height="20" rx="3" fill="#1F4E5B"/>
    <rect x="160" y="180" width="10" height="20" rx="3" fill="#B8541A"/>
  </g>

  <!-- Funnel caption -->
  <text x="270" y="440" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#6B6B6B" letter-spacing="3">100 VISITORS → 47 BOOKINGS</text>

  <!-- Right side: big italic revenue number -->
  <text x="1100" y="276" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#B8541A" letter-spacing="4">LOST PER YEAR</text>
  <text x="1100" y="396" text-anchor="end" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="132" font-weight="500" fill="#14161A" letter-spacing="-4">$33,000</text>
  <text x="1100" y="436" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="500" fill="#6B6B6B" letter-spacing="2">ILLUSTRATIVE · FIFTY LOST RESERVATIONS A MONTH</text>

  <!-- Bottom title block -->
  <line x1="100" y1="485" x2="1100" y2="485" stroke="#E8E2D6" stroke-width="1.5"/>
  <text x="600" y="534" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="36" font-weight="500" fill="#14161A" letter-spacing="-1">Why your restaurant loses</text>
  <text x="600" y="576" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="36" font-weight="400" fill="#1F4E5B" letter-spacing="-1">reservations every night.</text>
</svg>
