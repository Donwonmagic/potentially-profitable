<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="toolglow" cx="82%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#FAF7F2" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1F4E5B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="muntinField" x="0" y="0" width="140" height="140"
             patternUnits="userSpaceOnUse">
      <g transform="translate(18, 18)"
         fill="none" stroke="#FAF7F2" stroke-width="1.5"
         stroke-linecap="square" stroke-linejoin="miter">
        <rect x="0" y="0" width="104" height="104"/>
        <line x1="52" y1="0" x2="52" y2="104"/>
        <line x1="0" y1="36" x2="104" y2="36"/>
      </g>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#1F4E5B"/>
  <rect width="1200" height="630" fill="url(#muntinField)" opacity="0.05"/>
  <rect width="1200" height="630" fill="url(#toolglow)"/>
  <rect x="0" y="0" width="12" height="252" fill="#C5A059"/>
  <rect x="0" y="252" width="12" height="378" fill="#C5A059" opacity="0.4"/>

  <g transform="translate(80, 78) scale(1.5)"
     fill="none" stroke="#C5A059" stroke-width="1.167"
     stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <rect x="3.5" y="3.5" width="6" height="6" rx="0.5"/>
    <rect x="14.5" y="3.5" width="6" height="6" rx="0.5"/>
    <rect x="3.5" y="14.5" width="6" height="6" rx="0.5"/>
    <rect x="14.5" y="14.5" width="6" height="6" rx="0.5"/>
  </g>

  <text x="136" y="104"
        font-family="Inter, Arial, sans-serif" font-size="13"
        font-weight="700" letter-spacing="4" fill="#C5A059">FREE · YOUR HOURS NEVER LEAVE YOUR BROWSER</text>

  <text x="80" y="192"
        font-family="Fraunces, Georgia, serif" font-size="62"
        font-weight="500" letter-spacing="-2" fill="#FAF7F2">Get your hours</text>
  <text x="80" y="264"
        font-family="Fraunces, Georgia, serif" font-style="italic"
        font-size="62" font-weight="400" letter-spacing="-2"
        fill="#C5A059">right everywhere.</text>
  <text x="80" y="336"
        font-family="Fraunces, Georgia, serif" font-size="62"
        font-weight="500" letter-spacing="-2" fill="#FAF7F2">Once. About 15 minutes.</text>

  <text x="80" y="416"
        font-family="Inter, Arial, sans-serif" font-size="20"
        font-weight="400" fill="#FAF7F2" opacity="0.72">A door sign, a Google paste-block, and a JSON-LD code block for your developer.</text>

  <!-- Right pane: a stylized weekly schedule. Mirrors the muntin window
       motif (4-pane grid divided by ink crossbars). -->
  <g transform="translate(760, 140)">
    <g stroke="#FAF7F2" stroke-width="3"
       stroke-linecap="square" stroke-linejoin="miter"
       fill="none" opacity="0.5">
      <rect x="0" y="0" width="340" height="340"/>
      <line x1="170" y1="0" x2="170" y2="340"/>
      <line x1="0" y1="170" x2="340" y2="170"/>
    </g>
    <g font-family="Inter, Arial, sans-serif" font-size="11"
       font-weight="700" letter-spacing="2"
       fill="#FAF7F2" opacity="0.55">
      <text x="20" y="26">HOURS</text>
      <text x="320" y="26" text-anchor="end">CLOSURES</text>
      <text x="20" y="324">DOOR SIGN</text>
      <text x="320" y="324" text-anchor="end">CODE</text>
    </g>
    <!-- Hours rows in top-left pane -->
    <g font-family="Inter, Arial, sans-serif" font-size="13"
       font-weight="500" fill="#FAF7F2" opacity="0.9">
      <text x="20" y="62">Mon</text>     <text x="160" y="62" text-anchor="end">closed</text>
      <text x="20" y="86">Tue</text>     <text x="160" y="86" text-anchor="end">5–10 PM</text>
      <text x="20" y="110">Wed</text>    <text x="160" y="110" text-anchor="end">5–10 PM</text>
      <text x="20" y="134">Thu</text>    <text x="160" y="134" text-anchor="end">5–10 PM</text>
    </g>
    <!-- Closure entries in top-right pane -->
    <g font-family="Inter, Arial, sans-serif" font-size="13"
       font-weight="500" fill="#FAF7F2" opacity="0.9">
      <text x="190" y="62">Nov 26</text>  <text x="320" y="62" text-anchor="end">Thanksgiving</text>
      <text x="190" y="86">Dec 24</text>  <text x="320" y="86" text-anchor="end">Christmas Eve</text>
      <text x="190" y="110">Dec 25</text> <text x="320" y="110" text-anchor="end">Christmas</text>
      <text x="190" y="134">Dec 31</text> <text x="320" y="134" text-anchor="end">NYE</text>
    </g>
    <!-- Door sign mark in bottom-left -->
    <g transform="translate(20, 200)" fill="none" stroke="#C5A059"
       stroke-width="2" opacity="0.85">
      <rect x="0" y="0" width="140" height="100" rx="2"/>
      <line x1="0" y1="30" x2="140" y2="30"/>
      <line x1="14" y1="50" x2="100" y2="50"/>
      <line x1="14" y1="62" x2="120" y2="62"/>
      <line x1="14" y1="74" x2="86" y2="74"/>
    </g>
    <!-- Code lines in bottom-right -->
    <g font-family="ui-monospace, Consolas, monospace" font-size="10"
       fill="#FAF7F2" opacity="0.7">
      <text x="190" y="200">&lt;script type=...&gt;</text>
      <text x="190" y="216">  "@type":</text>
      <text x="190" y="232">    "Restaurant",</text>
      <text x="190" y="248">  "openingHours":</text>
      <text x="190" y="264">    [...]</text>
      <text x="190" y="280">&lt;/script&gt;</text>
    </g>
    <!-- Brand mark at the muntin intersection -->
    <g transform="translate(155, 155)">
      <rect x="0" y="0" width="30" height="30" rx="3" fill="#1F4E5B"/>
      <g transform="translate(5, 5)" fill="none" stroke="#C5A059"
         stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter">
        <rect x="2" y="2" width="16" height="16"/>
        <line x1="10" y1="2" x2="10" y2="18"/>
        <line x1="2" y1="7" x2="18" y2="7"/>
      </g>
    </g>
  </g>

  <g transform="translate(80, 552)" fill="#FAF7F2" opacity="0.6">
    <circle cx="8" cy="8" r="8" fill="none" stroke="#FAF7F2" stroke-width="1"/>
    <text x="8" y="12" text-anchor="middle"
          font-family="Fraunces, Georgia, serif" font-style="italic"
          font-size="11" font-weight="500" fill="#FAF7F2">d</text>
  </g>

  <line x1="80" y1="584" x2="1120" y2="584"
        stroke="rgba(250,247,242,0.2)" stroke-width="1"/>
  <text x="80" y="614"
        font-family="Inter, Arial, sans-serif" font-size="14"
        font-weight="600" letter-spacing="2" fill="rgba(250,247,242,0.6)">MUNTIN DIGITAL</text>
  <text x="1120" y="614" text-anchor="end"
        font-family="Inter, Arial, sans-serif" font-size="14"
        font-weight="600" letter-spacing="1" fill="rgba(250,247,242,0.6)">muntin.digital/tools/open-hours/</text>
</svg>
