<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#FAF7F2"/>
  <rect x="0" y="0" width="6" height="630" fill="#B8541A"/>

  <text x="72" y="90" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#B8541A" letter-spacing="5">PRICING · OPERATIONS</text>

  <text x="72" y="200" font-family="Fraunces, Georgia, serif" font-size="54" font-weight="500" fill="#14161A" letter-spacing="-2">How to raise menu</text>
  <text x="72" y="270" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="54" font-weight="400" fill="#1F4E5B" letter-spacing="-2">prices on your website</text>
  <text x="72" y="340" font-family="Fraunces, Georgia, serif" font-size="44" font-weight="500" fill="#14161A" letter-spacing="-1">without losing reservations</text>

  <!-- Right: price ladder illustration -->
  <g transform="translate(850, 160)">
    <rect x="0" y="0" width="280" height="56" rx="8" fill="#FFFFFF" stroke="#E8E2D6" stroke-width="1.5"/>
    <text x="20" y="35" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#6B6B6B" letter-spacing="2">ANCHORS</text>
    <text x="260" y="35" text-anchor="end" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="600" fill="#14161A">Hold</text>

    <rect x="0" y="68" width="280" height="56" rx="8" fill="#FFFFFF" stroke="#E8E2D6" stroke-width="1.5"/>
    <text x="20" y="103" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#6B6B6B" letter-spacing="2">CORE</text>
    <text x="260" y="103" text-anchor="end" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="600" fill="#B8541A">+ 4–6%</text>

    <rect x="0" y="136" width="280" height="56" rx="8" fill="#FFFFFF" stroke="#E8E2D6" stroke-width="1.5"/>
    <text x="20" y="171" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#6B6B6B" letter-spacing="2">SIGNATURE</text>
    <text x="260" y="171" text-anchor="end" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="600" fill="#B8541A">+ 8–12%</text>

    <rect x="0" y="204" width="280" height="56" rx="8" fill="#14161A"/>
    <text x="20" y="239" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#C5A059" letter-spacing="2">MARGIN</text>
    <text x="260" y="239" text-anchor="end" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="18" font-weight="500" fill="#FAF7F2">recovered</text>
  </g>

  <text x="72" y="570" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B6B6B" letter-spacing="2">MUNTIN DIGITAL</text>
  <text x="1128" y="570" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#6B6B6B">muntin.digital/blog</text>
