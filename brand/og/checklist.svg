<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#FAF7F2"/>

  <!-- Subtle top-left accent -->
  <rect x="0" y="0" width="520" height="4" fill="#1F4E5B"/>

  <!-- Giant 23 numeral, left side -->
  <text x="80" y="470" font-family="Fraunces, Georgia, serif" font-size="440" font-weight="500" fill="#1F4E5B" letter-spacing="-18">23</text>

  <!-- Progress track under the 23 — implies interactivity -->
  <rect x="96" y="508" width="420" height="10" rx="5" fill="#E8E2D6"/>
  <rect x="96" y="508" width="260" height="10" rx="5" fill="#1F4E5B"/>
  <text x="96" y="548" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F4E5B" letter-spacing="0.5">14 of 23 complete</text>

  <!-- Right side content -->
  <text x="620" y="170" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#6B6B6B" letter-spacing="4">FREE &#183; INTERACTIVE &#183; 10-MINUTE AUDIT</text>

  <!-- Headline: three lines, with italic emphasis on the key phrase -->
  <text x="620" y="260" font-family="Fraunces, Georgia, serif" font-size="58" font-weight="500" fill="#14161A" letter-spacing="-1.2">The restaurant</text>
  <text x="620" y="324" font-family="Fraunces, Georgia, serif" font-size="58" font-weight="500" fill="#14161A" letter-spacing="-1.2">website checklist</text>
  <text x="620" y="404" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="52" font-weight="400" fill="#1F4E5B" letter-spacing="-1">every owner needs.</text>

  <!-- Checked circle row — visual rhythm implying the 23 items -->
  <g transform="translate(620, 450)">
    <!-- 8 circles — first 5 are "checked" (teal with white checkmark), last 3 are empty teal outlines -->
    <circle cx="18" cy="18" r="18" fill="#1F4E5B"/>
    <path d="M10 18 l5 5 l9 -9" stroke="#FAF7F2" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="62" cy="18" r="18" fill="#1F4E5B"/>
    <path d="M54 18 l5 5 l9 -9" stroke="#FAF7F2" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="106" cy="18" r="18" fill="#1F4E5B"/>
    <path d="M98 18 l5 5 l9 -9" stroke="#FAF7F2" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="150" cy="18" r="18" fill="#1F4E5B"/>
    <path d="M142 18 l5 5 l9 -9" stroke="#FAF7F2" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="194" cy="18" r="18" fill="#1F4E5B"/>
    <path d="M186 18 l5 5 l9 -9" stroke="#FAF7F2" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="238" cy="18" r="17" fill="none" stroke="#D4CCBC" stroke-width="2"/>
    <circle cx="282" cy="18" r="17" fill="none" stroke="#D4CCBC" stroke-width="2"/>
    <circle cx="326" cy="18" r="17" fill="none" stroke="#D4CCBC" stroke-width="2"/>
  </g>

  <!-- Footer line -->
  <line x1="620" y1="536" x2="1120" y2="536" stroke="#1F4E5B" stroke-width="1.5" opacity="0.35"/>
  <text x="620" y="574" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="500" fill="#6B6B6B" letter-spacing="0.6">Score your site in 10 minutes  &#183;  muntin.digital</text>
</svg>
