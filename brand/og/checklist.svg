<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#FAF7F2"/>

  <!-- Left content zone -->
  <text x="72" y="90" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F4E5B" letter-spacing="5">FREE TOOL · 10 MINUTES</text>

  <text x="72" y="190" font-family="Fraunces, Georgia, serif" font-size="64" font-weight="500" fill="#14161A" letter-spacing="-2">The Restaurant</text>
  <text x="72" y="265" font-family="Fraunces, Georgia, serif" font-size="64" font-weight="500" fill="#14161A" letter-spacing="-2">Website Checklist</text>
  <text x="72" y="330" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="36" font-weight="400" fill="#1F4E5B">24 things your site should do in 2026.</text>

  <text x="72" y="400" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#6B6B6B">Interactive. Free. Progress saves automatically.</text>

  <!-- Right side: mini checklist preview -->
  <rect x="780" y="80" width="360" height="470" rx="12" fill="#FFFFFF" stroke="#E8E2D6" stroke-width="1.5"/>

  <!-- Checked items -->
  <circle cx="815" cy="128" r="12" fill="#1F4E5B"/><path d="M809 128 L813 132 L822 123" stroke="#FAF7F2" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="840" y="120" width="180" height="8" rx="4" fill="#E8E2D6"/><rect x="840" y="136" width="120" height="6" rx="3" fill="#F3EEE3"/>

  <circle cx="815" cy="185" r="12" fill="#1F4E5B"/><path d="M809 185 L813 189 L822 180" stroke="#FAF7F2" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="840" y="177" width="200" height="8" rx="4" fill="#E8E2D6"/><rect x="840" y="193" width="140" height="6" rx="3" fill="#F3EEE3"/>

  <circle cx="815" cy="242" r="12" fill="#1F4E5B"/><path d="M809 242 L813 246 L822 237" stroke="#FAF7F2" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="840" y="234" width="160" height="8" rx="4" fill="#E8E2D6"/><rect x="840" y="250" width="100" height="6" rx="3" fill="#F3EEE3"/>

  <!-- Unchecked items -->
  <circle cx="815" cy="299" r="12" fill="none" stroke="#E8E2D6" stroke-width="2"/>
  <rect x="840" y="291" width="190" height="8" rx="4" fill="#E8E2D6"/><rect x="840" y="307" width="130" height="6" rx="3" fill="#F3EEE3"/>

  <circle cx="815" cy="356" r="12" fill="none" stroke="#E8E2D6" stroke-width="2"/>
  <rect x="840" y="348" width="170" height="8" rx="4" fill="#E8E2D6"/><rect x="840" y="364" width="110" height="6" rx="3" fill="#F3EEE3"/>

  <!-- Progress bar at bottom of card -->
  <rect x="800" y="500" width="320" height="8" rx="4" fill="#E8E2D6"/>
  <rect x="800" y="500" width="192" height="8" rx="4" fill="#1F4E5B"/>
  <text x="800" y="530" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F4E5B">3 of 5 complete</text>

  <!-- Bottom bar -->
  <line x1="0" y1="590" x2="1200" y2="590" stroke="#E8E2D6" stroke-width="1"/>
  <text x="72" y="616" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B6B6B" letter-spacing="2">MUNTIN DIGITAL</text>
  <text x="1128" y="616" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#6B6B6B" letter-spacing="1">muntin.digital</text>
</svg>
