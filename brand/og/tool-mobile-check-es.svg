<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#14161A"/>
  <defs>
    <radialGradient id="mobglow-es" cx="80%" cy="32%" r="52%">
      <stop offset="0%" stop-color="#1F4E5B" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#14161A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#mobglow-es)"/>

  <text x="72" y="90" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#FAF7F2" letter-spacing="5" opacity="0.55">HERRAMIENTA GRATIS · MÓVIL · 10 SEGUNDOS</text>

  <text x="72" y="210" font-family="Fraunces, Georgia, serif" font-size="68" font-weight="500" fill="#FAF7F2" letter-spacing="-2">¿Tu sitio es</text>
  <text x="72" y="285" font-family="Fraunces, Georgia, serif" font-size="68" font-weight="500" fill="#FAF7F2" letter-spacing="-2">apto para móvil?</text>
  <text x="72" y="355" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="30" font-weight="400" fill="#FAF7F2" opacity="0.65">Tres revisiones: viewport, botones, tamaño del texto.</text>

  <!-- Phone mockup on the right -->
  <g transform="translate(830, 120)" font-family="Inter, Arial, sans-serif">
    <rect x="0" y="0" width="220" height="400" rx="28" fill="#FAF7F2" opacity="0.06"/>
    <rect x="10" y="40" width="200" height="330" rx="12" fill="#FAF7F2" opacity="0.04"/>
    <!-- Viewport bar -->
    <rect x="24" y="60" width="172" height="14" rx="3" fill="#FAF7F2" opacity="0.2"/>
    <text x="24" y="98" font-size="10" fill="#FAF7F2" letter-spacing="2" opacity="0.5">VIEWPORT</text>
    <circle cx="196" cy="95" r="7" fill="#1f9d55"/>
    <!-- Tap targets -->
    <rect x="24" y="124" width="172" height="44" rx="22" fill="#1F4E5B" opacity="0.5"/>
    <text x="110" y="152" text-anchor="middle" font-size="13" font-weight="600" fill="#FAF7F2" opacity="0.85">RESERVAR</text>
    <text x="24" y="192" font-size="10" fill="#FAF7F2" letter-spacing="2" opacity="0.5">BOTONES</text>
    <circle cx="196" cy="189" r="7" fill="#1f9d55"/>
    <!-- Font size -->
    <text x="24" y="228" font-size="16" fill="#FAF7F2" opacity="0.8">Menú legible</text>
    <text x="24" y="250" font-size="11" fill="#FAF7F2" opacity="0.4">Descripción del plato...</text>
    <text x="24" y="282" font-size="10" fill="#FAF7F2" letter-spacing="2" opacity="0.5">TEXTO</text>
    <circle cx="196" cy="279" r="7" fill="#d97706"/>
    <text x="193" y="283" font-size="10" font-weight="700" fill="#FAF7F2">!</text>
    <!-- Score circle -->
    <circle cx="110" cy="335" r="24" fill="#1F4E5B" opacity="0.5"/>
    <text x="110" y="342" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="22" font-weight="500" fill="#FAF7F2">77</text>
  </g>

  <rect y="580" width="1200" height="50" fill="#1F4E5B" opacity="0.2"/>
  <text x="72" y="612" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#FAF7F2" letter-spacing="2" opacity="0.6">REVISIÓN MÓVIL EN 10 SEGUNDOS · GRATIS</text>
  <text x="1128" y="612" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#FAF7F2" letter-spacing="1" opacity="0.7">muntin.digital/es</text>
</svg>
