<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#14161A"/>
  <defs>
    <radialGradient id="schglow-es" cx="75%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#1F4E5B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#14161A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#schglow-es)"/>

  <text x="72" y="90" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#FAF7F2" letter-spacing="5" opacity="0.55">HERRAMIENTA GRATIS · SCHEMA · 10 SEGUNDOS</text>

  <text x="72" y="210" font-family="Fraunces, Georgia, serif" font-size="68" font-weight="500" fill="#FAF7F2" letter-spacing="-2">¿Google entiende</text>
  <text x="72" y="285" font-family="Fraunces, Georgia, serif" font-size="68" font-weight="500" fill="#FAF7F2" letter-spacing="-2">tu negocio?</text>
  <text x="72" y="355" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="30" font-weight="400" fill="#FAF7F2" opacity="0.65">Revisa tu schema. Mira si sabe qué eres.</text>

  <!-- JSON-LD-style code preview -->
  <g transform="translate(750, 130)" font-family="ui-monospace, Menlo, monospace" font-size="14">
    <rect x="0" y="0" width="380" height="320" rx="10" fill="#FAF7F2" opacity="0.06"/>
    <text x="22" y="36" fill="#FAF7F2" opacity="0.4">&lt;script type="application/ld+json"&gt;</text>
    <text x="22" y="62" fill="#FAF7F2" opacity="0.85">{</text>
    <text x="40" y="84" fill="#C9A84C">"@context":</text>
    <text x="120" y="84" fill="#FAF7F2" opacity="0.8">"schema.org",</text>
    <text x="40" y="106" fill="#C9A84C">"@type":</text>
    <text x="92" y="106" fill="#FAF7F2" opacity="0.8">"Restaurant",</text>
    <text x="40" y="128" fill="#C9A84C">"name":</text>
    <text x="85" y="128" fill="#FAF7F2" opacity="0.8">"Tu Restaurante",</text>
    <text x="40" y="150" fill="#C9A84C">"priceRange":</text>
    <text x="125" y="150" fill="#FAF7F2" opacity="0.8">"$$",</text>
    <text x="40" y="172" fill="#C9A84C">"servesCuisine":</text>
    <text x="146" y="172" fill="#FAF7F2" opacity="0.8">"Mexicana",</text>
    <text x="40" y="194" fill="#C9A84C">"openingHours":</text>
    <text x="137" y="194" fill="#FAF7F2" opacity="0.8">"Mo-Su 11:00-22:00"</text>
    <text x="22" y="216" fill="#FAF7F2" opacity="0.85">}</text>
    <text x="22" y="240" fill="#FAF7F2" opacity="0.4">&lt;/script&gt;</text>
    <!-- Check badge -->
    <circle cx="340" cy="280" r="18" fill="#1f9d55"/>
    <path d="M330 280 L337 287 L350 274" stroke="#FAF7F2" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="22" y="290" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#FAF7F2" opacity="0.75">Schema válido</text>
  </g>

  <rect y="580" width="1200" height="50" fill="#1F4E5B" opacity="0.2"/>
  <text x="72" y="612" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#FAF7F2" letter-spacing="2" opacity="0.6">RICH RESULTS · HORARIOS · PRECIO · MENÚ</text>
  <text x="1128" y="612" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#FAF7F2" letter-spacing="1" opacity="0.7">muntin.digital/es</text>
</svg>
