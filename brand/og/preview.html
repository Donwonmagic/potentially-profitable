<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OG card contact sheet · Muntin Digital</title>
<meta name="robots" content="noindex, nofollow" />
<style>
  :root {
    --ink: #16181D;
    --cream: #F6F7F8;
    --muted: #6B7280;
    --rule: #E3E5E9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 48px;
    background: var(--cream);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  header {
    max-width: 1200px;
    margin: 0 auto 32px;
  }
  header h1 {
    font-family: Georgia, "Fraunces", serif;
    font-size: 42px;
    margin: 0 0 12px;
    letter-spacing: -1px;
  }
  header p { color: var(--muted); margin: 0; }
  .grid {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr;
    gap: 32px;
  }
  @media (min-width: 900px) {
    .grid { grid-template-columns: 1fr 1fr; }
  }
  figure { margin: 0; }
  figure img {
    display: block;
    width: 100%;
    height: auto;
    border: 1px solid var(--rule);
    border-radius: 4px;
  }
  figcaption {
    padding: 8px 4px 0;
    font-family: "SF Mono", Menlo, monospace;
    font-size: 12px;
    color: var(--muted);
  }
  section { max-width: 1200px; margin: 48px auto 0; }
  section h2 {
    font-family: Georgia, serif;
    font-size: 22px;
    font-weight: 500;
    margin: 0 0 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--rule);
  }
</style>
</head>
