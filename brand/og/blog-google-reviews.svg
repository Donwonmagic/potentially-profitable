<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#FAF7F2"/>

  <!-- Window mark top-left -->
  <g transform="translate(72, 72)" stroke="#14161A" stroke-width="7" stroke-linecap="square" stroke-linejoin="miter" fill="none">
    <rect x="0" y="0" width="60" height="60"/>
    <line x1="30" y1="0" x2="30" y2="60"/>
    <line x1="0" y1="22" x2="60" y2="22"/>
  </g>

  <!-- Eyebrow top-right -->
  <text x="1128" y="108" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B6B6B" letter-spacing="4">MUNTIN DIGITAL · WRITING</text>

  <!-- Title block -->
  <text x="600" y="230" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="72" font-weight="500" fill="#14161A" letter-spacing="-2">How to Get More</text>
  <text x="600" y="320" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="80" font-weight="400" fill="#1F4E5B" letter-spacing="-2">Google Reviews</text>
  <text x="600" y="400" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="56" font-weight="500" fill="#14161A" letter-spacing="-1">for Your Restaurant</text>

  <!-- Five stars row -->
  <g transform="translate(600, 470)">
    <polygon points="-80,0 -74,12 -63,14 -71,21 -69,32 -80,26 -91,32 -89,21 -97,14 -86,12" fill="#C28B2E"/>
    <polygon points="-40,0 -34,12 -23,14 -31,21 -29,32 -40,26 -51,32 -49,21 -57,14 -46,12" fill="#C28B2E"/>
    <polygon points="0,0 6,12 17,14 9,21 11,32 0,26 -11,32 -9,21 -17,14 -6,12" fill="#C28B2E"/>
    <polygon points="40,0 46,12 57,14 49,21 51,32 40,26 29,32 31,21 23,14 34,12" fill="#C28B2E"/>
    <polygon points="80,0 86,12 97,14 89,21 91,32 80,26 69,32 71,21 63,14 74,12" fill="#1F4E5B"/>
  </g>

  <!-- Label under stars -->
  <text x="600" y="534" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#6B6B6B" letter-spacing="4">THE SYSTEM THAT WORKS WITHOUT ASKING TWICE</text>

  <!-- URL bottom -->
  <text x="600" y="584" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#6B6B6B" letter-spacing="1">muntin.digital/blog</text>
</svg>
