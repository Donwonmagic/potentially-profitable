<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#FAF7F2"/>
  <rect x="0" y="0" width="6" height="630" fill="#6E4B8C"/>

  <text x="72" y="90" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#6E4B8C" letter-spacing="5">AI · STRATEGY</text>

  <text x="72" y="200" font-family="Fraunces, Georgia, serif" font-size="54" font-weight="500" fill="#14161A" letter-spacing="-2">Can ChatGPT write</text>
  <text x="72" y="272" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="54" font-weight="400" fill="#1F4E5B" letter-spacing="-2">your restaurant website?</text>
  <text x="72" y="340" font-family="Fraunces, Georgia, serif" font-size="40" font-weight="500" fill="#14161A" letter-spacing="-1">(And should it?)</text>

  <!-- Right: three prompt-output cards -->
  <g transform="translate(850, 130)">
    <rect x="0" y="0" width="280" height="80" rx="10" fill="#FFFFFF" stroke="#E8E2D6" stroke-width="1.5"/>
    <text x="20" y="28" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#6B6B6B" letter-spacing="2">GENERIC</text>
    <text x="20" y="50" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="14" fill="#6B6B6B">&ldquo;Authentic Italian</text>
    <text x="20" y="68" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="14" fill="#6B6B6B">dining experience.&rdquo;</text>

    <rect x="0" y="100" width="280" height="80" rx="10" fill="#FFFFFF" stroke="#E8E2D6" stroke-width="1.5"/>
    <text x="20" y="128" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#6B6B6B" letter-spacing="2">LIGHTLY PROMPTED</text>
    <text x="20" y="150" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="14" fill="#14161A">&ldquo;Neighborhood trattoria,</text>
    <text x="20" y="168" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="14" fill="#14161A">handmade pasta daily.&rdquo;</text>

    <rect x="0" y="200" width="280" height="80" rx="10" fill="#14161A"/>
    <text x="20" y="228" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#C5A059" letter-spacing="2">NATIVELY WRITTEN</text>
    <text x="20" y="250" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="14" fill="#FAF7F2">&ldquo;Nonna&rsquo;s Sunday gravy,</text>
    <text x="20" y="268" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="14" fill="#FAF7F2">every Sunday since &rsquo;98.&rdquo;</text>
  </g>

  <text x="72" y="570" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B6B6B" letter-spacing="2">MUNTIN DIGITAL</text>
  <text x="1128" y="570" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#6B6B6B">muntin.digital/blog</text>
</svg>
