<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#FAF7F2"/>
  <rect x="0" y="0" width="6" height="630" fill="#B8541A"/>

  <text x="72" y="90" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#B8541A" letter-spacing="5">STRATEGY · PRODUCT</text>

  <text x="72" y="200" font-family="Fraunces, Georgia, serif" font-size="56" font-weight="500" fill="#14161A" letter-spacing="-2">Should you actually</text>
  <text x="72" y="272" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="56" font-weight="400" fill="#1F4E5B" letter-spacing="-2">make a restaurant app</text>
  <text x="72" y="336" font-family="Fraunces, Georgia, serif" font-size="48" font-weight="500" fill="#14161A" letter-spacing="-1">in 2026?</text>

  <!-- Right: phone mockup with a giant red "NO" stamp over it -->
  <g transform="translate(880, 120)">
    <rect x="0" y="0" width="220" height="380" rx="28" fill="#14161A"/>
    <rect x="14" y="14" width="192" height="352" rx="18" fill="#FAF7F2"/>
    <circle cx="110" cy="26" r="4" fill="#14161A"/>

    <rect x="34" y="60" width="152" height="14" rx="3" fill="#E8E2D6"/>
    <rect x="34" y="82" width="108" height="10" rx="2" fill="#E8E2D6"/>

    <rect x="34" y="120" width="152" height="40" rx="6" fill="#1F4E5B"/>
    <rect x="34" y="170" width="152" height="40" rx="6" fill="#E8E2D6"/>
    <rect x="34" y="220" width="152" height="40" rx="6" fill="#E8E2D6"/>

    <!-- "NO" stamp rotated -->
    <g transform="translate(110, 230) rotate(-14)">
      <rect x="-92" y="-28" width="184" height="56" rx="10" fill="none" stroke="#B8541A" stroke-width="4"/>
      <text x="0" y="12" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#B8541A" letter-spacing="8">PROBABLY NOT</text>
    </g>
  </g>

  <text x="72" y="570" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#6B6B6B" letter-spacing="2">MUNTIN DIGITAL</text>
  <text x="1128" y="570" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#6B6B6B">muntin.digital/blog</text>
</svg>
