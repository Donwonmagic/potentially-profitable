<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#FAF7F2"/>
  
    <defs>
      <pattern id="muntinField" x="0" y="0" width="140" height="140"
               patternUnits="userSpaceOnUse">
        <g transform="translate(18, 18)"
           fill="none" stroke="#14161A" stroke-width="1.5"
           stroke-linecap="square" stroke-linejoin="miter">
          <rect x="0" y="0" width="104" height="104"/>
          <line x1="52" y1="0" x2="52" y2="104"/>
          <line x1="0" y1="36" x2="104" y2="36"/>
        </g>
      </pattern>
    </defs>
    <rect width="1200" height="630"
          fill="url(#muntinField)" opacity="0.045"/>
  
  
    <rect x="0" y="0" width="12" height="252" fill="#B8541A"/>
    <rect x="0" y="252" width="12" height="378" fill="#B8541A" opacity="0.4"/>
  

  
    <g transform="translate(80, 78) scale(1.5)"
       fill="none" stroke="#B8541A" stroke-width="1.167"
       stroke-linecap="round" stroke-linejoin="round"
       color="#B8541A" opacity="0.85">
      <polygon points="13 2 4 14 11 14 10 22 20 10 13 10 14 2"/>
    </g>
  
  <text x="136" y="104"
        font-family="Inter, Arial, sans-serif" font-size="13"
        font-weight="700" letter-spacing="4" fill="#B8541A">THINK WITH GOOGLE · 2017</text>

  <text x="80" y="192"
        font-family="Fraunces, Georgia, serif" font-size="60"
        font-weight="500" letter-spacing="-2" fill="#14161A">The first</text>
  <text x="80" y="264"
        font-family="Fraunces, Georgia, serif" font-style="italic"
        font-size="60" font-weight="400" letter-spacing="-2"
        fill="#B8541A">three</text>
  <text x="80" y="328"
        font-family="Fraunces, Georgia, serif" font-size="60"
        font-weight="500" letter-spacing="-2" fill="#14161A">seconds.</text>

  <text x="80" y="408"
        font-family="Inter, Arial, sans-serif" font-size="20"
        font-weight="400" fill="#6B6B6B">Mobile load time and the bounce curve behind it.</text>

  
      <text x="780" y="200"
            font-family="Inter, Arial, sans-serif" font-size="12"
            font-weight="700" letter-spacing="3" fill="#14161A" opacity="0.5">N = 900,000 MOBILE ADS · 2017</text>
      <text x="780" y="320"
            font-family="Fraunces, Georgia, serif" font-size="128"
            font-weight="500" letter-spacing="-4" fill="#B8541A">53%</text>
      <text x="780" y="376"
            font-family="Inter, Arial, sans-serif" font-size="18"
            font-weight="500" fill="#14161A" opacity="0.78">bounce after a 3-second mobile load</text>
    

  
    <g transform="translate(80, 552)" fill="#6B6B6B" opacity="0.6">
      <circle cx="8" cy="8" r="8" fill="none" stroke="#6B6B6B" stroke-width="1"/>
      <text x="8" y="12" text-anchor="middle"
            font-family="Fraunces, Georgia, serif" font-style="italic"
            font-size="11" font-weight="500" fill="#6B6B6B">d</text>
    </g>
  
  
    <line x1="80" y1="584" x2="1120" y2="584"
          stroke="#E8E2D6" stroke-width="1"/>
    <text x="80" y="614"
          font-family="Inter, Arial, sans-serif" font-size="14"
          font-weight="600" letter-spacing="2" fill="#6B6B6B">MUNTIN DIGITAL</text>
    <text x="1120" y="614" text-anchor="end"
          font-family="Inter, Arial, sans-serif" font-size="14"
          font-weight="600" letter-spacing="1" fill="#6B6B6B">muntin.digital</text>
  
</svg>
