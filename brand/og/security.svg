<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#16181D"/>
  
    <defs>
      <pattern id="muntinField" x="0" y="0" width="140" height="140"
               patternUnits="userSpaceOnUse">
        <g transform="translate(18, 18)"
           fill="none" stroke="#F6F7F8" stroke-width="1.5"
           stroke-linecap="square" stroke-linejoin="miter">
          <rect x="0" y="0" width="104" height="104"/>
          <line x1="52" y1="0" x2="52" y2="104"/>
          <line x1="0" y1="36" x2="104" y2="36"/>
        </g>
      </pattern>
    </defs>
    <rect width="1200" height="630"
          fill="url(#muntinField)" opacity="0.05"/>
  
  
  <defs>
    
    <radialGradient id="ghWarm" cx="86%" cy="13%" r="82%">
      <stop offset="0%"  stop-color="#FFB020"  stop-opacity="0.3"/>
      <stop offset="38%" stop-color="#FF6B5C" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#FFB020" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ghCast" cx="5%" cy="98%" r="76%">
         <stop offset="0%"  stop-color="#2A50C8" stop-opacity="0.22"/>
         <stop offset="100%" stop-color="#2A50C8" stop-opacity="0"/>
       </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#ghCast)"/>
  <rect width="1200" height="630" fill="url(#ghWarm)"/>

  

  
    <g transform="translate(80, 102) scale(1.5)"
       fill="none" stroke="#FFB020" stroke-width="1.167"
       stroke-linecap="round" stroke-linejoin="round"
       color="#FFB020" opacity="0.78">
      <polyline points="8 6 3 12 8 18"/>
          <polyline points="16 6 21 12 16 18"/>
          <line x1="14" y1="4" x2="10" y2="20"/>
    </g>
  
  <text x="136" y="128"
        font-family="Inter, Arial, sans-serif" font-size="14"
        font-weight="700" letter-spacing="5" fill="#F6F7F8" opacity="0.55">DATA · TRUST</text>

  <text x="80" y="232"
        font-family="Fraunces, Georgia, serif" font-size="76"
        font-weight="500" letter-spacing="-2" fill="#F6F7F8">Your numbers</text>
  <text x="80" y="312"
        font-family="Fraunces, Georgia, serif" font-style="italic"
        font-size="76" font-weight="400" letter-spacing="-2"
        fill="#F6F7F8" opacity="0.82">stay on</text>
  <text x="80" y="392"
        font-family="Fraunces, Georgia, serif" font-size="76"
        font-weight="500" letter-spacing="-2" fill="#F6F7F8">your laptop.</text>

  <text x="80" y="472"
        font-family="Inter, Arial, sans-serif" font-size="22"
        font-weight="400" fill="#F6F7F8" opacity="0.65">Nine verifiable claims about how every Muntin tool handles your data — and a 5-test framework you can run on any free tool.</text>

  
    <g transform="translate(80, 552)" fill="#F6F7F8" opacity="0.6">
      <circle cx="8" cy="8" r="8" fill="none" stroke="#F6F7F8" stroke-width="1"/>
      <text x="8" y="12" text-anchor="middle"
            font-family="Fraunces, Georgia, serif" font-style="italic"
            font-size="11" font-weight="500" fill="#F6F7F8">d</text>
    </g>
  
  
    <line x1="80" y1="584" x2="1120" y2="584"
          stroke="rgba(246,247,248,0.18)" stroke-width="1"/>
    <text x="80" y="614"
          font-family="Inter, Arial, sans-serif" font-size="14"
          font-weight="600" letter-spacing="2" fill="rgba(246,247,248,0.55)">MUNTIN DIGITAL</text>
    <text x="1120" y="614" text-anchor="end"
          font-family="Inter, Arial, sans-serif" font-size="14"
          font-weight="600" letter-spacing="1" fill="rgba(246,247,248,0.55)">muntin.digital</text>
  
</svg>
