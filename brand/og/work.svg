<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Two-panel split: Irish Inn deep green | Off Day Collective warm near-black -->
  <rect width="600" height="630" fill="#123821"/>
  <rect x="600" width="600" height="630" fill="#0D0C0A"/>

  <!-- Center gold hairline -->
  <line x1="600" y1="80" x2="600" y2="550" stroke="#C5A059" stroke-width="1.5" opacity="0.35"/>

  <!-- Left panel: Irish Inn -->
  <text x="300" y="240" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#C5A059" letter-spacing="3">RESTAURANT  ·  REDESIGN STUDY</text>
  <text x="300" y="330" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="44" font-weight="500" fill="#FAF7F2">Stewards of</text>
  <text x="300" y="390" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="44" font-weight="500" fill="#C5A059">History.</text>

  <!-- Right panel: Off Day Collective -->
  <text x="900" y="240" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#C9A84C" letter-spacing="5">LIFESTYLE  ·  BRAND LAUNCH</text>
  <text x="900" y="330" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="44" font-weight="300" fill="#F9F7F2">Silence is a</text>
  <text x="900" y="390" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="44" font-weight="300" fill="#C9A84C">luxury.</text>

  <!-- Bottom band -->
  <text x="600" y="558" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#F9F7F2" letter-spacing="4" opacity="0.85">SELECTED WORK  ·  MUNTIN DIGITAL</text>
</svg>
