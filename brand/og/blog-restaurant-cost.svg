<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#FAF7F2"/>

  <!-- Window mark top-left -->
  <g transform="translate(72, 72)" stroke="#14161A" stroke-width="7" stroke-linecap="square" stroke-linejoin="miter" fill="none">
    <rect x="0" y="0" width="60" height="60"/>
    <line x1="30" y1="0" x2="30" y2="60"/>
    <line x1="0" y1="22" x2="60" y2="22"/>
  </g>

  <!-- Eyebrow top-right -->
  <text x="1128" y="108" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B6B6B" letter-spacing="4">MUNTIN DIGITAL · WRITING</text>

  <!-- Big italic number, center focus -->
  <text x="600" y="300" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="172" font-weight="500" fill="#1F4E5B" letter-spacing="-5">$5k – $9k</text>

  <!-- Label under number -->
  <text x="600" y="346" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#6B6B6B" letter-spacing="4">WHERE MOST RESTAURANTS LAND</text>

  <!-- Thin rule -->
  <line x1="480" y1="380" x2="720" y2="380" stroke="#E8E2D6" stroke-width="1.5"/>

  <!-- Post title -->
  <text x="600" y="428" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="34" font-weight="500" fill="#14161A" letter-spacing="-0.5">How much does a custom restaurant</text>
  <text x="600" y="470" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="34" font-weight="400" fill="#1F4E5B" letter-spacing="-0.5">website cost in 2026?</text>

  <!-- URL bottom -->
  <text x="600" y="568" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#6B6B6B" letter-spacing="1">muntin.digital/blog</text>
</svg>
