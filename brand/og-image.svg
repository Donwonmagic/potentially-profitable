<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Muntin Digital — Structure Brings Clarity.">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&amp;family=Inter:wght@400;500&amp;display=swap');
      .headline { font-family: 'Fraunces', Georgia, 'Times New Roman', serif; font-weight: 500; letter-spacing: -2px; fill: #14161A; }
      .headline-italic { font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-style: italic; fill: #B8541A; letter-spacing: -2px; }
      .eyebrow { font-family: 'Inter', -apple-system, sans-serif; font-weight: 500; font-size: 22px; fill: #1F4E5B; letter-spacing: 3px; }
      .sub { font-family: 'Inter', -apple-system, sans-serif; font-weight: 400; font-size: 26px; fill: #2A2D33; }
      .wordmark { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 34px; fill: #14161A; letter-spacing: -0.5px; }
      .tagline { font-family: 'Inter', -apple-system, sans-serif; font-weight: 500; font-size: 18px; fill: #6B6B6B; letter-spacing: 1px; }
      .url { font-family: 'Inter', -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #1F4E5B; }
    </style>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#F3EEE3"/>
    </linearGradient>
    <linearGradient id="tealGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F4E5B" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1F4E5B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rustGlow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#B8541A" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#B8541A" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#tealGlow)"/>
  <rect width="1200" height="630" fill="url(#rustGlow)"/>

  <!-- Subtle inner border -->
  <rect x="24" y="24" width="1152" height="582" rx="18" ry="18" fill="none" stroke="#E8E2D6" stroke-width="2"/>

  <!-- Left block: eyebrow, headline, sub -->
  <g transform="translate(90,130)">
    <line x1="0" y1="16" x2="52" y2="16" stroke="#1F4E5B" stroke-width="2"/>
    <text x="68" y="22" class="eyebrow">A DIGITAL STUDIO OF ONE</text>

    <text x="0" y="110" font-size="84" class="headline">Your complete</text>
    <text x="0" y="200" font-size="84" class="headline">online presence,</text>
    <text x="0" y="290" font-size="84" class="headline-italic">handled<tspan class="headline" dx="22">by one person.</tspan></text>

    <text x="0" y="360" class="sub">Brand · Websites · Social · Care — one partner.</text>
  </g>

  <!-- Right: actual brand mark (ink) in an offset window frame -->
  <g transform="translate(850,155)">
    <!-- Soft drop-shadow card -->
    <rect x="6" y="14" width="260" height="320" rx="8" fill="#14161A" opacity="0.08"/>
    <!-- Card surface -->
    <rect x="0" y="0" width="260" height="320" rx="8" fill="#FFFFFF" stroke="#E8E2D6" stroke-width="1.5"/>
    <!-- The mark itself — identical paths to brand/mark/mark-ink.svg -->
    <g transform="translate(66,96) scale(1.0)" fill="none" stroke="#14161A" stroke-width="9" stroke-linecap="square" stroke-linejoin="miter">
      <rect x="18" y="18" width="92" height="92"/>
      <line x1="64" y1="18" x2="64" y2="110"/>
      <line x1="18" y1="49" x2="110" y2="49"/>
    </g>
  </g>

  <!-- Bottom bar: mini lockup + tagline + URL -->
  <g transform="translate(90,555)">
    <!-- Small mark -->
    <g transform="translate(0,-28)" fill="none" stroke="#14161A" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter">
      <rect x="0" y="0" width="38" height="38"/>
      <line x1="19" y1="0" x2="19" y2="38"/>
      <line x1="0" y1="12" x2="38" y2="12"/>
    </g>
    <text x="54" y="0" class="wordmark">Muntin Digital</text>
    <text x="300" y="0" class="tagline">STRUCTURE BRINGS CLARITY.</text>
    <text x="1020" y="0" class="url">muntin.digital</text>
  </g>
</svg>
