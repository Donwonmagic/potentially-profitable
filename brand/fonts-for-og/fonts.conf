<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Fontconfig configuration for OG-card PNG rendering.

  rsvg-convert resolves font-family via fontconfig. On Cloudflare
  Pages build containers (and anywhere else our render step runs),
  the default system font set lacks Fraunces and Inter, so cards
  fall back to Georgia + Arial — visually close but not the real
  types. Point fontconfig at the repo's self-hosted TTFs so the
  render uses the intended faces and OG cards look identical to
  the live site.

  The TTFs live at assets/fonts/pdf/ (originally added for PDF
  export of the restaurant checklist — same files, reused here).
  A relative path from this file would be ../../assets/fonts/pdf,
  but fontconfig doesn't expand relative paths reliably across
  containers. Instead, scripts/render-og-pngs.py computes the
  absolute path at runtime and invokes rsvg-convert with this
  file as FONTCONFIG_FILE — fontconfig reads <dir> entries
  literally, so we want absolute paths. This file is treated
  as a template: the {{FONTS_DIR}} placeholder is replaced by
  the renderer before use.
-->
<fontconfig>
  <!-- Point fontconfig at the repo's Fraunces + Inter TTFs. -->
  <dir>{{FONTS_DIR}}</dir>

  <!-- Cache dir: keep fontconfig's cache inside the build working
       directory so nothing writes to /root on containerized builds. -->
  <cachedir prefix="xdg">fontconfig</cachedir>

  <!-- Fallback chain: when a family isn't found, prefer the system
       sans / serif set. This matters for Spanish characters and any
       glyph our TTFs don't include (diacritics are covered, but
       dingbats/emoji fall through to system). -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Fraunces</family></prefer>
  </alias>
</fontconfig>
