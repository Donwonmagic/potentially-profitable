<style>
  /* /es/tools/start/ — árbol de decisión de cinco preguntas.
     Radios HTML simples. JS solo revela el panel de resultados y
     reordena la lista de herramientas; sin router, sin librería de estado. */
  .ts-main { padding: clamp(64px, 10vh, 120px) clamp(20px, 4vw, 64px) clamp(56px, 9vh, 100px); }
  .ts-shell { max-width: 760px; margin: 0 auto; }
  .ts-eyebrow { font-family: var(--font-body); font-size: 13px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--teal); margin: 0 0 14px; display: inline-flex; align-items: center; gap: 10px; }
  .ts-eyebrow::before { content: ''; width: 28px; height: 1px; background: var(--teal); }
  .ts-h1 { font-family: var(--font-display); font-size: clamp(34px, 5vw, 48px); font-weight: 500; line-height: 1.08; letter-spacing: -0.02em; color: var(--ink); margin: 0 0 18px; }
  .ts-sub { font-size: var(--fs-lead); line-height: var(--leading-card); color: var(--ink-soft); margin: 0 0 28px; max-width: 60ch; }
  .ts-form { display: flex; flex-direction: column; gap: 22px; margin: 0 0 28px; }
  .ts-q { padding: 18px 22px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface-1); }
  .ts-q legend { font-family: var(--font-display); font-size: 18px; font-weight: 500; color: var(--ink); padding: 0; margin: 0 0 6px; line-height: 1.35; }
  .ts-q-help { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 14px; line-height: var(--leading-card); }
  .ts-options { display: flex; flex-direction: column; gap: 8px; }
  .ts-option { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface-2); cursor: pointer; font-size: 14px; line-height: var(--leading-card); color: var(--ink); transition: border-color var(--t-fast) var(--ease), background var(--t-fast) var(--ease); }
  .ts-option:hover { border-color: var(--teal); }
  .ts-option input { flex: 0 0 auto; margin: 3px 0 0; cursor: pointer; }
  .ts-option:has(input:checked) { border-color: var(--teal); background: var(--teal-tint); }
  .ts-option-text strong { display: block; font-weight: 600; color: var(--ink); }
  .ts-option-text span { display: block; font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .ts-actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin: 6px 0 0; }
  .ts-actions .ts-progress { font-size: 12.5px; color: var(--stone); margin-left: auto; font-variant-numeric: tabular-nums; }
  .ts-result { display: none; padding: 22px 24px; border: 1px solid var(--line); border-left: 3px solid var(--teal); border-radius: var(--r-md); background: var(--surface-1); box-shadow: var(--elev-1); margin-top: 8px; }
  .ts-result[data-shown="true"] { display: block; }
  .ts-result h2 { font-family: var(--font-display); font-size: clamp(22px, 2.4vw, 28px); font-weight: 500; line-height: 1.25; color: var(--ink); margin: 0 0 8px; letter-spacing: -0.01em; }
  .ts-result-lede { font-size: 15.5px; line-height: var(--leading-card); color: var(--ink-soft); margin: 0 0 16px; }
  .ts-rec-list { list-style: none; padding: 0; margin: 0; counter-reset: rec; display: flex; flex-direction: column; gap: 12px; }
  .ts-rec-list li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface-2); }
  .ts-rec-list li::before { counter-increment: rec; content: counter(rec); display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 999px; background: var(--teal); color: var(--cream); font-weight: 700; font-size: 13px; }
  .ts-rec-name { font-weight: 600; color: var(--ink); font-size: 15px; }
  .ts-rec-name a { color: inherit; text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--teal) 35%, transparent); }
  .ts-rec-name a:hover, .ts-rec-name a:focus-visible { border-bottom-color: var(--teal); }
  .ts-rec-why { display: block; font-size: 13px; color: var(--ink-soft); line-height: 1.5; margin-top: 2px; }
  .ts-skip { font-size: 13px; color: var(--stone); margin: 16px 0 0; line-height: var(--leading-card); }
  .ts-fallback { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 13.5px; line-height: var(--leading-card); color: var(--ink-soft); }
  .ts-fallback a { color: var(--teal); font-weight: 600; text-decoration: none; }
  .ts-fallback a:hover { text-decoration: underline; }
  @media (max-width: 540px) {
    .ts-q { padding: 16px 18px; }
    .ts-result { padding: 18px 20px; }
  }
</style>
