.md-celebrate{position:fixed;inset:0;background:rgba(20,30,30,.6);display:flex;align-items:center;justify-content:center;z-index:1300;animation:md-celebrate-fade .25s ease}
@keyframes md-celebrate-fade{from{opacity:0}to{opacity:1}}
.md-celebrate-canvas{position:fixed;inset:0;pointer-events:none}
.md-celebrate-card{position:relative;z-index:1;background:var(--cream,#FAF6EE);border:1px solid var(--line);border-radius:16px;padding:32px 28px;max-width:460px;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.32);animation:md-celebrate-rise .35s ease}
@keyframes md-celebrate-rise{from{transform:translateY(20px) scale(.95);opacity:.5}to{transform:none;opacity:1}}
.md-celebrate-card h2{font-family:var(--font-display);font-size:24px;font-weight:500;color:var(--ink);margin:0 0 8px}
.md-celebrate-card p{font-size:14px;color:var(--ink-soft);line-height:1.55;margin:0 0 20px}
.md-celebrate-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.md-celebrate-actions button{font-size:13.5px;padding:9px 14px;border-radius:6px;border:1px solid var(--accent,#1f6f6a);background:#fff;color:var(--accent,#1f6f6a);cursor:pointer;font-weight:500}
.md-celebrate-actions button[data-act="print"]{background:var(--accent,#1f6f6a);color:#fff}
.md-celebrate-actions button:hover{filter:brightness(1.05)}
.md-celebrate-back{margin-top:12px;font-size:13px;padding:7px 14px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
@media(prefers-reduced-motion:reduce){.md-celebrate,.md-celebrate-card{animation:none}}

/* W5-2 — mid-flow encouragement toast. */
.md-encourage{position:fixed;left:50%;top:80px;transform:translateX(-50%) translateY(-8px);background:var(--ink,#14161A);color:var(--cream,#FAF6EE);font-size:14px;padding:10px 16px;border-radius:24px;box-shadow:0 12px 28px rgba(0,0,0,.18);max-width:min(560px,calc(100% - 32px));text-align:center;line-height:1.4;opacity:0;pointer-events:none;transition:opacity .24s ease,transform .24s ease;z-index:1150}
.md-encourage.show{opacity:1;transform:translateX(-50%) translateY(0)}

<body>

<header class="nav" id="nav"></header>

<main id="main">

<nav class="breadcrumb container" aria-label="Ruta de navegación">
  <a href="/es/">Inicio</a>
  <span class="breadcrumb-sep" aria-hidden="true">›</span>

<section class="block">
  <div class="container" style="max-width:880px;">
    <div class="md-hero">
      <p class="md-eyebrow">Herramienta gratis · Acomodo de menú para cualquier cantidad de platos</p>
      <h1 style="font-family:var(--font-display);font-size:clamp(30px,4vw,42px);font-weight:500;color:var(--ink);margin:0 0 14px;line-height:1.15;">Un menú, acomodado para los platos <span class="serif-italic" style="color:var(--teal);">que realmente tienes</span>.</h1>
      <p style="font-size:16px;color:var(--ink-soft);line-height:1.6;margin:0 0 0;">Las plantillas de Canva asumen 12 platos. Los restaurantes reales tienen 14, 27, o 53. Escribe tus platos, elige un tema, sube tu logo — los acomodamos en un PDF imprimible para la cantidad que tengas. Sin software de diseño, sin pelear con plantillas.</p>
      <p class="md-walkaway"><strong>Te llevas:</strong> Un PDF imprimible de tu menú — tus platos, tus precios, tu logo, en el conteo que tengas.</p>
    </div>

    <aside class="md-ctx" id="mdCtx" hidden role="status" aria-live="polite">
      <span class="md-ctx-eyebrow">Recordamos de tu última visita</span>
      <ul class="md-ctx-chips" id="mdCtxChips"></ul>
      <button type="button" class="md-ctx-use" id="mdCtxUse">Usar estos</button>
    </aside>

    <div class="md-grid" id="mdGrid">
      <table>
        <thead>
          <tr>
            <th scope="col" style="width:32%;">Plato</th>
            <th scope="col" style="width:18%;">Precio</th>
            <th scope="col">Descripción</th>
            <th scope="col" style="width:36px;"></th>
          </tr>
        </thead>
        <tbody id="mdRows"></tbody>
      </table>
      <div class="md-grid-actions">
        <button type="button" class="md-add-row" id="mdAddRow">+ Añadir un plato</button>
        <button type="button" class="md-add-section" id="mdAddSection">+ Añadir una sección</button>
        <button type="button" class="md-sample" id="mdSample">Cargar menú de muestra</button>
        <button type="button" class="md-clear" id="mdClear">Limpiar</button>
      </div>
    </div>

    <button type="button" class="md-stick" id="mdStick">+ Añadir un plato</button>

    <details class="md-paste" id="mdPaste">
      <summary>Pega tu menú desde una hoja de cálculo</summary>
      <div class="md-paste-body">
        <p class="md-paste-help">Pega un CSV o TSV con un plato por fila. Encabezados como <code>Plato</code> / <code>Nombre</code> / <code>Sección</code> / <code>Precio</code> / <code>Descripción</code> se mapean solos (también en inglés: <code>Item</code>, <code>Section</code>, <code>Price</code>). Las secciones también pueden ser líneas que empiezan con <code>##</code>.</p>
        <textarea id="mdPasteArea" spellcheck="false" autocomplete="off" placeholder="## Entradas&#10;Ensalada César,$14,Hojas tiernas con aderezo de buttermilk&#10;Pan de la casa,$6&#10;## Platos fuertes&#10;Pollo asado,$28,Medio pollo de granja con jugo de la sartén"></textarea>
        <div class="md-paste-actions">
          <button type="button" class="md-paste-btn" id="mdPasteApply">Añadir a mi menú</button>
        </div>
      </div>
    </details>

    <p class="md-status" id="mdStatus"><strong>0</strong> platos · <strong>0</strong> secciones — tu menú vive solo en este navegador.</p>

    <div class="md-themes">
      <p class="md-themes-label">Elige un tema</p>
      <ul class="md-themes-list" id="mdThemes" role="radiogroup" aria-label="Tema de menú"></ul>
    </div>

    <div class="md-options">
      <div class="md-option">
        <p class="md-option-label">Logo (opcional)</p>
        <label class="md-logo-drop" id="mdLogoDrop">
          <span class="md-logo-thumb" id="mdLogoThumb"><span class="md-logo-thumb-empty" aria-hidden="true">+</span></span>
          <span class="md-logo-meta">
            <span class="md-logo-meta-line" id="mdLogoLine">Elegir foto o tomar una nueva</span>
            <span class="md-logo-meta-sub">PNG, JPG, o SVG. Se queda en este dispositivo.</span>
          </span>
          <input type="file" id="mdLogoInput" accept="image/png,image/jpeg,image/svg+xml,image/webp" capture="environment" />
        </label>
        <p class="md-logo-warn" id="mdLogoWarn" hidden></p>
      </div>
      <div class="md-option">
        <p class="md-option-label">Papel</p>
        <div class="md-paper-row" id="mdPaperRow" role="radiogroup" aria-label="Tamaño de papel">
          <label><input type="radio" name="md-paper" value="letter" checked /> Carta</label>
          <label><input type="radio" name="md-paper" value="a4" /> A4</label>
          <label><input type="radio" name="md-paper" value="half-page" /> Media página</label>
        </div>
      </div>
    </div>

    <div class="md-preview-wrap">
      <div class="md-preview-label">
        <span class="md-preview-label-text">Vista previa en vivo</span>
        <span class="md-preview-label-meta" id="mdPreviewMeta"></span>
      </div>
      <div class="md-preview-frame" id="mdPreviewFrame">
        <article class="md-preview-paper" id="mdPaper" aria-live="polite"></article>
      </div>
      <div class="md-overflow-warn" id="mdOverflow" hidden></div>
    </div>

    <div class="md-download">
      <p class="md-download-text"><strong>Listo cuando tú quieras.</strong> Toca Descargar para guardar tu menú como PDF. El archivo se genera en tu navegador — nada se sube.</p>
      <button type="button" class="md-download-btn" id="mdDownload" aria-label="Descargar menú como PDF">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Descargar PDF
      </button>
      <p class="md-download-msg" id="mdDownloadMsg" role="status" aria-live="polite"></p>
    </div>

    <div class="md-history" id="mdHistory" hidden></div>

    <div class="md-honesty">
      <h3>Qué es, y qué no es.</h3>
      <p><strong>Es:</strong> un motor de acomodo automático para cualquier cantidad de platos, cuatro temas tipográficos, salida en carta / A4 / media / tríptico / mesa, CMYK + sangrado para imprenta, RGB para compartir.</p>
      <p><strong>No es:</strong> un copywriter (<a href="/es/tools/menu-copy/">Inspector de Copy de Menú</a> califica y reescribe descripciones), un generador de fotos (<a href="/es/tools/photo-brief/">Brief de Foto</a> arma la sesión), un traductor, un calificador de rentabilidad (<a href="/es/tools/menu-engineering/">Menu Engineering</a> califica el margen), ni InDesign. Los temas están limitados a propósito para que la salida no se vea amateur.</p>
      <p><strong>Postura de privacidad:</strong> Abre DevTools → Network. Escribe un plato, pega tu menú, cambia el tema. La pestaña Network sigue vacía. La página es HTML estático más un solo archivo JavaScript sin minificar que puedes leer directamente.</p>
    </div>

  </div>
</section>
