<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>KPIs — Admin</title>
<meta name="theme-color" content="#1F4E5B" />
<link rel="icon" type="image/svg+xml" href="/brand/mark/mark-square-ink.svg" />
<link rel="apple-touch-icon" sizes="180x180" href="/brand/favicons/apple-touch-icon.png" />
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/fraunces-variable-latin-wght-normal.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/inter-variable-latin-wght-normal.woff2" crossorigin>
<style>
/* Critical CSS — prevents flash of unstyled content while the main
   stylesheet (assets/site.css) loads non-render-blocking via the
   <link> below. Carries: token vars used in inline styles elsewhere,
   body baseline (cream + ink + body-size + line-height), container
   width, skip-link affordance, and a min-height reservation for the
   fixed nav so layout doesn't shift when site.css applies. ~600
   bytes. Documented in Phase 3B perf cutover; the full token set
   reapplies once site.css arrives. */
:root{--cream:#FAF7F2;--cream-2:#F3EEE3;--ink:#14161A;--ink-soft:#2A2D33;--teal:#1F4E5B;--max:1200px;--pad-x:clamp(20px,4vw,64px)}
html{box-sizing:border-box}*,*:before,*:after{box-sizing:inherit}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--cream);line-height:1.6;font-size:17px;-webkit-font-smoothing:antialiased}
.container{max-width:var(--max);margin:0 auto;padding-inline:var(--pad-x)}
.skip-link{position:absolute;left:-9999px;top:0}
.skip-link:focus{position:static;display:inline-block;background:#14161A;color:#FAF7F2;padding:12px 16px;z-index:100}
/* injected by inject-critical-link-color.mjs */
a{color:inherit}
.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 26px;border-radius:999px;font-weight:500;font-size:15px;text-decoration:none;white-space:nowrap;cursor:pointer}
.btn-primary{background:var(--ink);color:var(--cream)}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid #D9D5CB}
header.nav{min-height:64px}
/* nav-critical */
.nav{position:fixed;top:0;left:0;right:0;background:var(--cream);z-index:50;border-bottom:1px solid #E8E2D6}
.nav-inner{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:64px;padding:12px 0}
.logo{display:flex;align-items:center;gap:10px;font-family:Georgia,serif;font-size:22px;font-weight:600;letter-spacing:-0.02em;flex-shrink:0;white-space:nowrap;color:inherit;text-decoration:none}
.logo-mark{width:28px;height:28px;flex:0 0 28px}
.tm{font-size:0.5em;vertical-align:super;margin-left:1px}
.nav-links{display:flex;gap:36px;font-size:15px}
.nav-links a{text-decoration:none;color:inherit}
.nav-toggle{display:none}
.nav-search-btn,.lang-switch{display:none}
@media (max-width:1100px){.nav-links{display:none}.nav-toggle{display:flex;width:44px;height:44px;flex-direction:column;justify-content:center;align-items:center;gap:5px;background:transparent;border:0;padding:0}.nav-toggle span{display:block;width:22px;height:2px;background:var(--ink)}.nav-inner .btn-primary{display:none}}
main{padding-top:64px}
/* perf-critical */
:root{--font-display:'Fraunces','Fraunces Fallback',Georgia,'Times New Roman',serif;--font-body:'Inter','Inter Fallback',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--ink-soft:#2A2D33;--teal:#1F4E5B;--teal-dark:#143640;--stone:#6B6B6B;--line:#E8E2D6;--line-dark:#D4CCBC}
body{font-family:var(--font-body)}
h1,h2,h3,h4,h5,.serif-italic{font-family:var(--font-display)}
@font-face{font-family:'Fraunces';font-style:normal;font-weight:100 900;font-display:swap;src:url('/assets/fonts/fraunces-variable-latin-wght-normal.woff2') format('woff2-variations');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Fraunces';font-style:italic;font-weight:100 900;font-display:swap;src:url('/assets/fonts/fraunces-variable-latin-wght-italic.woff2') format('woff2-variations');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url('/assets/fonts/inter-variable-latin-wght-normal.woff2') format('woff2-variations');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Inter';font-style:italic;font-weight:100 900;font-display:swap;src:url('/assets/fonts/inter-variable-latin-wght-italic.woff2') format('woff2-variations');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Fraunces Fallback';src:local('Times New Roman');size-adjust:100%;ascent-override:97.8%;descent-override:25.5%;line-gap-override:0%}
@font-face{font-family:'Inter Fallback';src:local('Arial');size-adjust:100%;ascent-override:96.875%;descent-override:24.121%;line-gap-override:0%}
.hero{padding:160px 0 100px;position:relative;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1.1fr 0.9fr;gap:60px;align-items:center}
@media (max-width:960px){.hero{padding:130px 0 60px}.hero-grid{grid-template-columns:1fr;gap:48px}}
.hero h1{margin-top:24px;text-wrap:balance;max-width:18ch}
.hero h1 .serif-italic{font-style:italic;font-weight:400;color:var(--teal)}
.hero-sub{margin-top:28px;max-width:520px;font-size:clamp(17px,1.35vw,20px);line-height:1.55;color:var(--ink-soft)}
.hero-ctas{margin-top:40px;display:flex;gap:14px;flex-wrap:wrap}
.hero-counts{display:flex;flex-wrap:wrap;gap:10px 14px;list-style:none;padding:0;margin:18px 0 22px;font-size:13.5px;font-weight:600;letter-spacing:0.02em;color:var(--ink-soft)}
.hero-counts__chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--cream-2)}
.hero-counts__chip strong{color:var(--teal)}
section.block{padding:clamp(80px,10vw,140px) 0}
.bg-cream2{background:var(--cream-2)}
.section-header{max-width:760px;margin-bottom:64px}
.section-header h2{margin-top:16px}
.section-header p{margin-top:20px;font-size:19px;line-height:1.55;color:var(--ink-soft);max-width:640px}
.section-center{text-align:center;margin-left:auto;margin-right:auto}
.compare,.services,.care,.steps{display:grid;grid-template-columns:1fr;gap:20px}
.work{display:grid;grid-template-columns:repeat(12,1fr);gap:24px}
.work-item{grid-column:span 12}
.about-grid{display:grid;grid-template-columns:1fr;gap:48px;align-items:center}
.contact-grid{display:grid;grid-template-columns:1fr;gap:clamp(40px,6vw,80px);align-items:start}
.form-row{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:961px){.compare,.services,.care{grid-template-columns:repeat(3,1fr)}.steps{grid-template-columns:repeat(4,1fr)}.work-item:nth-child(1){grid-column:span 7}.work-item:nth-child(2){grid-column:span 5}.work-item:nth-child(3){grid-column:span 5}.work-item:nth-child(4){grid-column:span 7}.about-grid{grid-template-columns:0.9fr 1.1fr;gap:80px}.contact-grid{grid-template-columns:1fr 1.2fr}}
@media (min-width:641px){.form-row{grid-template-columns:1fr 1fr}}
@media (max-width:960px){.window,.window-caption{display:none}}
.mobile-cta-bar{display:none}
.trust-strip{padding:18px 0;background:var(--cream-2);border-block:1px solid var(--line)}
.trust-strip__list{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px;list-style:none;padding:0;margin:0;font-size:13.5px;color:var(--ink-soft);line-height:1.5}
footer{background:var(--ink);color:rgba(250,247,242,0.7);padding:64px 0 36px;border-top:1px solid rgba(250,247,242,0.08);font-size:14px}
.foot-cta{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;padding-bottom:40px;margin-bottom:48px;border-bottom:1px solid rgba(250,247,242,0.08)}
.foot-cta-text{color:var(--cream);font-family:var(--font-display);font-size:clamp(22px,2.6vw,30px);line-height:1.2;letter-spacing:-0.01em;max-width:460px}
.foot-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr 1.1fr;gap:clamp(24px,3vw,44px);padding-bottom:48px;margin-bottom:32px;border-bottom:1px solid rgba(250,247,242,0.08)}
@media (max-width:1100px){.foot-grid{grid-template-columns:1fr 1fr 1fr 1fr;gap:36px}}
@media (max-width:960px){.foot-grid{grid-template-columns:1fr 1fr 1fr;gap:40px}}
@media (max-width:640px){.foot-grid{grid-template-columns:1fr 1fr}.foot-cta{flex-direction:column;align-items:flex-start;gap:20px}}
@media (max-width:420px){.foot-grid{grid-template-columns:1fr}}
.foot-bottom{display:flex;justify-content:space-between;gap:24px;align-items:center;flex-wrap:wrap}
.below-fold-island{content-visibility:auto;contain-intrinsic-size:auto 1200px}
@media print{.below-fold-island{content-visibility:visible}}
</style>
<!-- Async-load the main stylesheet. Pattern: preload + onload-swap
     (with a <noscript> fallback for the JS-disabled path). The
     onload assigns this.rel='stylesheet', which the browser then
     applies; before that the critical CSS above carries the page. -->
<link rel="preload" as="style" href="/assets/site.css?v=5587620bd5ed" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="/assets/site.css?v=5587620bd5ed"></noscript>
<style>
  /* Phase G.12 (Growth) — admin KPI dashboard. Five tiles with the
     metric definition, Plausible filter, target_initial/target_q3,
     and what_it_measures. v1 is a static registry view — the live
     Plausible numbers are looked up by following the per-tile link
     to the Plausible UI. v2 wires Plausible API for inline values. */
  .admin-kpi{padding:96px 24px 64px;max-width:1080px;margin:0 auto;color:var(--ink)}
  .admin-kpi__head h1{font-family:var(--font-display);font-size:32px;line-height:1.15;margin:0 0 8px;color:var(--ink)}
  .admin-kpi__head p{font-size:15px;color:var(--ink-soft);margin:0 0 32px;max-width:680px;line-height:1.55}
  .admin-kpi__forbidden{padding:24px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-1);color:var(--ink-soft);font-size:15px;margin-top:32px}
  .admin-kpi__forbidden a{color:var(--teal);text-decoration:underline}
  .admin-kpi__grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;margin-top:8px}
  .kpi-tile{padding:24px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-1);box-shadow:var(--elev-1);display:flex;flex-direction:column;gap:12px}
  .kpi-tile__eyebrow{font-family:var(--font-body);font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-soft);margin:0}
  .kpi-tile__label{font-family:var(--font-display);font-size:20px;line-height:1.25;margin:0;color:var(--ink)}
  .kpi-tile__targets{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px}
  .kpi-tile__target{padding:6px 10px;background:var(--cream-2);border-radius:6px}
  .kpi-tile__target strong{color:var(--ink);font-variant-numeric:tabular-nums}
  .kpi-tile__filter{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.45;background:var(--cream-2);padding:10px 12px;border-radius:6px;white-space:pre-wrap;word-break:break-word;color:var(--ink)}
  .kpi-tile__what{font-size:14px;line-height:1.55;color:var(--ink-soft);margin:0}
  .kpi-tile__link{margin-top:auto;align-self:flex-start;color:var(--teal);font-size:13px;text-decoration:none;border-bottom:1px solid color-mix(in srgb, var(--teal) 35%, transparent);padding-bottom:1px}
  .kpi-tile__link:hover{border-bottom-color:var(--teal)}
  .admin-kpi__foot{margin-top:32px;font-size:13px;color:var(--ink-soft)}
  .admin-kpi__foot strong{color:var(--ink)}
</style>
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<main id="main">
  <section class="admin-kpi" id="kpiRoot">
    <header class="admin-kpi__head">
      <a class="admin-kpi__back" style="font-size:13px;color:var(--teal);text-decoration:none" href="/workbench/">&larr; Workshop</a>
      <h1>North-star KPIs</h1>
      <p>The 5 metrics that decide whether this is working. Reviewed quarterly — see the registry at <code>data/kpis.json</code>.</p>
    </header>

    <p class="admin-kpi__forbidden" id="kpiForbidden" hidden>This is the editor's dashboard. <a href="/workbench/">Back to Workshop</a>.</p>
    <div class="admin-kpi__grid" id="kpiGrid" hidden></div>
    <p class="admin-kpi__foot" id="kpiFoot" hidden>Last reviewed: <strong id="kpiLastReviewed"></strong>. Bump <code>_lastReviewed</code> in <code>data/kpis.json</code> within 90 days or CI fails.</p>
  </section>
</main>

<script>
(function () {
  'use strict';
  function fmtTarget(v) {
    if (typeof v !== 'number') return String(v);
    if (v < 1) return Math.round(v * 100) + '%';
    return v.toLocaleString();
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c];
    });
  }
  function plausibleLink(filter) {
    // Best-effort: the Plausible UI accepts URL-encoded filter
    // expressions in the `f` query param. Fallback to dashboard root.
    var base = 'https://plausible.io/muntin.digital';
    return base;
  }
  fetch('/api/admin/kpis', { credentials: 'same-origin', headers: { 'accept': 'application/json' } })
    .then(function (r) {
      if (r.status === 403 || r.status === 401) {
        document.getElementById('kpiForbidden').hidden = false;
        return null;
      }
      if (!r.ok) throw new Error('fetch-failed');
      return r.json();
    })
    .then(function (data) {
      if (!data || !data.ok) return;
      var grid = document.getElementById('kpiGrid');
      var rows = data.kpis || [];
      grid.innerHTML = rows.map(function (k) {
        return [
          '<article class="kpi-tile" id="kpi-' + escapeHtml(k.id) + '">',
          '  <p class="kpi-tile__eyebrow">' + escapeHtml(k.id) + '</p>',
          '  <p class="kpi-tile__label">' + escapeHtml(k.label_en || k.id) + '</p>',
          '  <div class="kpi-tile__targets">',
          (k.target_initial != null ? '    <span class="kpi-tile__target">Initial: <strong>' + fmtTarget(k.target_initial) + '</strong></span>' : ''),
          (k.target_q3 != null      ? '    <span class="kpi-tile__target">Q3: <strong>' + fmtTarget(k.target_q3) + '</strong></span>' : ''),
          (k.window                 ? '    <span class="kpi-tile__target">Window: <strong>' + escapeHtml(k.window) + '</strong></span>' : ''),
          '  </div>',
          (k.metric                 ? '  <p class="kpi-tile__what"><em>' + escapeHtml(k.metric) + '</em></p>' : ''),
          (k.what_it_measures       ? '  <p class="kpi-tile__what">' + escapeHtml(k.what_it_measures) + '</p>' : ''),
          (k.plausible_filter       ? '  <pre class="kpi-tile__filter">' + escapeHtml(k.plausible_filter) + '</pre>' : ''),
          '  <a class="kpi-tile__link" href="' + plausibleLink(k.plausible_filter) + '" target="_blank" rel="noopener">Open Plausible &rarr;</a>',
          '</article>',
        ].join('\n');
      }).join('\n');
      grid.hidden = false;
      var foot = document.getElementById('kpiFoot');
      var fr = document.getElementById('kpiLastReviewed');
      fr.textContent = data._lastReviewed || '(unset)';
      foot.hidden = false;
    })
    .catch(function () {
      document.getElementById('kpiForbidden').hidden = false;
    });
})();
</script>

</body>
</html>
