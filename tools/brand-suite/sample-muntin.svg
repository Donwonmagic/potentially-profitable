<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="sample-title sample-desc">
  <title id="sample-title">Muntin Digital — brand sample</title>
  <desc id="sample-desc">A rich sample of the Muntin Digital identity used as a demo reference for the Brand Suite palette extractor. The mark, the wordmark, the tagline, and a rust accent line, set on cream.</desc>
  <rect x="0" y="0" width="720" height="360" fill="#F3EEE3"/>
  <g transform="translate(60 52)">
    <g fill="none" stroke="#1F4E5B" stroke-width="14" stroke-linecap="square" stroke-linejoin="miter">
      <rect x="18" y="18" width="220" height="220"/>
      <line x1="128" y1="18" x2="128" y2="238"/>
      <line x1="18" y1="92" x2="238" y2="92"/>
    </g>
  </g>
  <g transform="translate(340 120)">
    <text x="0" y="0" fill="#1F4E5B" font-family="Fraunces, Georgia, serif" font-size="72" font-weight="600" letter-spacing="-2">Muntin</text>
    <text x="0" y="76" fill="#1F4E5B" font-family="Fraunces, Georgia, serif" font-size="72" font-weight="600" letter-spacing="-2">Digital</text>
    <line x1="0" y1="110" x2="96" y2="110" stroke="#B8541A" stroke-width="6" stroke-linecap="square"/>
    <text x="0" y="152" fill="#1A1612" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500">The window in.</text>
  </g>
</svg>
