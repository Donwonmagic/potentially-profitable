/* === Menu Design Suite tool-scoped styles. Page-prefix .md-*. === */
.md-hero{max-width:760px;margin:0 auto;padding:32px 0 8px;text-align:center}
.md-eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin:0 0 12px}
.md-walkaway{margin:14px auto 0;max-width:520px;padding:10px 16px;background:var(--cream-2);border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:8px;font-size:13.5px;color:var(--ink);line-height:1.5}
.md-walkaway strong{color:var(--ink-soft);font-weight:600;margin-right:4px}

/* "We remember" pill — fed by MuntinContext on returning visits. */
.md-ctx{margin:18px 0 0;padding:10px 14px;background:var(--cream-2);border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.md-ctx[hidden]{display:none}
.md-ctx-eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
.md-ctx-chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.md-ctx-chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border:1px solid var(--line-dark);border-radius:999px;background:var(--white);font-size:12.5px;color:var(--ink)}
.md-ctx-chip-dot{display:inline-flex;gap:2px}
.md-ctx-chip-dot span{width:9px;height:9px;border-radius:2px;border:1px solid rgba(0,0,0,.15)}
.md-ctx-use{margin-left:auto;padding:6px 12px;border:1px solid var(--ink);border-radius:999px;background:var(--ink);color:var(--cream);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.md-ctx-use:hover{background:var(--teal)}

/* Dish list grid — table on desktop, card-stack on mobile (mirrors plate-cost data-label pattern). */
.md-grid{margin-top:18px;border:1px solid var(--line);border-radius:var(--r-input);overflow:hidden;background:var(--white)}
.md-grid table{width:100%;border-collapse:collapse}
.md-grid thead{background:var(--cream-2);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--stone)}
.md-grid th,.md-grid td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.md-grid input,.md-grid textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:14px;color:var(--ink);background:var(--white);box-sizing:border-box;resize:vertical}
.md-grid input:focus,.md-grid textarea:focus{border-color:var(--teal);outline:none}
.md-grid .md-row-section td{background:#F7F2E5;border-bottom:1px solid var(--line)}
.md-grid .md-row-section input{font-family:var(--font-display);font-weight:500;font-size:15px;color:var(--ink);border-color:transparent;background:transparent}
.md-grid .md-remove{padding:4px;border:0;background:transparent;color:var(--stone);cursor:pointer;font-size:18px;line-height:1;border-radius:50%;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center}
.md-grid .md-remove:hover{background:var(--cream-2);color:var(--rust)}
.md-grid-actions{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;background:var(--cream-2);border-top:1px solid var(--line);align-items:center}
.md-add-row,.md-add-section,.md-clear,.md-sample{padding:7px 14px;border-radius:999px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;background:transparent}
.md-add-row{border:1px dashed var(--line-dark);color:var(--stone)}
.md-add-row:hover{border-color:var(--teal);color:var(--teal)}
.md-add-section{border:1px solid var(--teal);color:var(--teal);background:var(--white)}
.md-add-section:hover{background:var(--teal);color:var(--cream)}
.md-sample{border:1px solid var(--line-dark);background:var(--white);color:var(--ink)}
.md-clear{border:1px solid var(--line);background:var(--white);color:var(--stone);margin-left:auto}
.md-clear:hover{border-color:var(--rust);color:var(--rust)}

/* Mobile card-stack (<640px) — rows become cards using data-label + ::before. */
@media(max-width:640px){
  .md-grid table,.md-grid thead,.md-grid tbody,.md-grid tr,.md-grid td{display:block}
  .md-grid thead{display:none}
  .md-grid tr{padding:14px 14px 10px;border-bottom:1px solid var(--line)}
  .md-grid tr:last-child{border-bottom:0}
  .md-grid td{padding:6px 0;border:0}
  .md-grid td::before{content:attr(data-label);display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--stone);margin-bottom:3px}
  .md-grid .md-row-section td{background:transparent;border:0;padding:8px 0}
  .md-grid .md-row-section td::before{content:'Section'}
  .md-grid .md-remove-cell{display:flex;justify-content:flex-end;padding-top:6px}
  .md-grid .md-remove-cell::before{display:none}
  .md-grid-actions{justify-content:stretch;flex-direction:column}
  .md-add-row,.md-add-section,.md-clear,.md-sample{width:100%;justify-content:center}
  .md-clear{margin-left:0}
}

/* Sticky add-dish pill follows scroll edge so item 27 still has a one-tap path. */
.md-stick{position:sticky;bottom:8px;align-self:end;margin-top:-44px;margin-right:14px;padding:10px 16px;background:var(--ink);color:var(--cream);border:0;border-radius:999px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.15);z-index:5}
.md-stick:hover{background:var(--teal)}

/* Paste drawer (CSV/TSV ingest, mirrors plate-cost). */
.md-paste{margin-top:16px;border:1px dashed var(--line-dark);border-radius:8px;background:var(--white)}
.md-paste[open]{padding-bottom:14px}
.md-paste summary{cursor:pointer;padding:10px 14px;font-size:13.5px;font-weight:600;color:var(--ink);list-style:none}
.md-paste summary::-webkit-details-marker{display:none}
.md-paste summary::before{content:'+ ';color:var(--ink-soft)}
.md-paste[open] summary::before{content:'\2212  '}
.md-paste-body{padding:0 14px}
.md-paste textarea{width:100%;min-height:120px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:13px;font-family:ui-monospace,SFMono-Regular,monospace;background:var(--white);color:var(--ink);box-sizing:border-box;resize:vertical}
.md-paste-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.md-paste-btn{padding:8px 14px;border:1px solid var(--ink);border-radius:999px;background:var(--ink);color:var(--cream);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.md-paste-btn:hover{background:var(--teal)}
.md-paste-help{font-size:12.5px;color:var(--stone);margin:8px 0 0;line-height:1.55}
.md-paste-help code{background:var(--cream-2);padding:1px 5px;border-radius:3px;font-size:11.5px}

/* Status footer (post-Wave-A1: dish count + section count). Live, no fetch. */
.md-status{margin-top:14px;font-size:13px;color:var(--ink-soft);text-align:center}
.md-status strong{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

/* Theme picker — 4 chips, mobile single-row scrollable. */
.md-themes{margin:24px 0 0}
.md-themes-label{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin:0 0 10px}
.md-themes-list{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;list-style:none;padding:0;margin:0}
@media(max-width:640px){.md-themes-list{grid-template-columns:1fr 1fr}}
.md-theme{cursor:pointer;padding:14px 14px 12px;border:1px solid var(--line);border-radius:10px;background:var(--white);transition:border-color var(--t-fast),transform var(--t-fast)}
.md-theme:hover{border-color:var(--teal);transform:translateY(-1px)}
.md-theme[data-active="true"]{border-color:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 22%,transparent)}
.md-theme-name{font-family:var(--font-display);font-size:15px;font-weight:500;color:var(--ink);margin:0 0 4px}
.md-theme-blurb{font-size:11.5px;color:var(--stone);margin:0;line-height:1.5}
.md-theme-swatches{display:flex;gap:3px;margin-top:8px}
.md-theme-swatches span{width:10px;height:10px;border-radius:2px;border:1px solid rgba(0,0,0,.12)}

/* Logo + paper-size row. Two compact controls side by side. */
.md-options{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0 0}
@media(max-width:640px){.md-options{grid-template-columns:1fr}}
.md-option{padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--white)}
.md-option-label{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin:0 0 8px}
.md-logo-drop{display:flex;align-items:center;gap:10px;padding:10px;border:1px dashed var(--line-dark);border-radius:8px;background:var(--cream-2);cursor:pointer}
.md-logo-drop:hover{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 6%,var(--cream-2))}
.md-logo-drop input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.md-logo-thumb{width:48px;height:48px;border-radius:6px;background:var(--white);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:0 0 48px;overflow:hidden}
.md-logo-thumb img{max-width:100%;max-height:100%}
.md-logo-thumb-empty{font-size:18px;color:var(--stone)}
.md-logo-meta{flex:1;font-size:13px;color:var(--ink);min-width:0}
.md-logo-meta-line{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.md-logo-meta-sub{font-size:11.5px;color:var(--stone);margin-top:2px}
.md-logo-warn{margin-top:6px;font-size:11.5px;color:#b86c0f}
.md-paper-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.md-paper-row label{display:flex;align-items:center;gap:6px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:13px;color:var(--ink);background:var(--white)}
.md-paper-row label:has(input:checked){border-color:var(--teal);background:color-mix(in srgb,var(--teal) 7%,var(--white));color:var(--teal);font-weight:600}
.md-paper-row input{accent-color:var(--teal)}

/* Preview — HTML/CSS rendering. The PDF renderer (Wave A3) will
   read the same theme tokens; the HTML preview is the canonical
   on-screen representation. The PDF aims to match this 1:1. */
.md-preview-wrap{margin:28px 0 0}
.md-preview-label{display:flex;align-items:baseline;gap:10px;margin:0 0 10px}
.md-preview-label-text{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
.md-preview-label-meta{font-size:12px;color:var(--stone)}
.md-preview-frame{position:relative;padding:18px;background:var(--cream-2);border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:720px}
.md-preview-paper{margin:0 auto;background:var(--paper);color:var(--ink);box-shadow:0 4px 18px rgba(0,0,0,.10);padding:48px;width:100%;max-width:680px;box-sizing:border-box;font-family:var(--bodyFamily)}
.md-preview-paper h1.md-pp-title{font-family:var(--displayFamily);font-size:var(--h1px);font-weight:500;text-align:center;margin:0 0 26px;color:var(--ink);letter-spacing:0}
.md-preview-paper h2.md-pp-section{font-family:var(--displayFamily);font-weight:500;text-align:center;margin:24px 0 12px;color:var(--ink);letter-spacing:.04em}
.md-preview-paper .md-pp-cols{display:grid;gap:0 32px}
.md-preview-paper .md-pp-row{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:0 12px;padding:8px 0;break-inside:avoid}
.md-preview-paper .md-pp-name{font-weight:500;color:var(--ink)}
.md-preview-paper .md-pp-price{color:var(--ink);font-variant-numeric:tabular-nums}
.md-preview-paper .md-pp-desc{grid-column:1/-1;color:var(--muted);font-size:0.86em;margin-top:2px;line-height:1.4}
/* Theme-specific dividers + price styles. */
.md-preview-paper[data-divider="hand-rule"] h2.md-pp-section{position:relative;padding:0 22px}
.md-preview-paper[data-divider="hand-rule"] h2.md-pp-section::before,
.md-preview-paper[data-divider="hand-rule"] h2.md-pp-section::after{content:'';position:absolute;top:50%;width:48px;height:1px;background:var(--ink);opacity:.45}
.md-preview-paper[data-divider="hand-rule"] h2.md-pp-section::before{right:100%;margin-right:8px}
.md-preview-paper[data-divider="hand-rule"] h2.md-pp-section::after{left:100%;margin-left:8px}
.md-preview-paper[data-divider="box"] h2.md-pp-section{display:inline-block;border:1px solid var(--ink);padding:6px 18px;background:transparent;text-align:center;width:auto;margin-left:auto;margin-right:auto;margin-bottom:14px}
.md-preview-paper[data-divider="ornament"] h2.md-pp-section::before{content:'\2766\2002';color:var(--accent)}
.md-preview-paper[data-divider="ornament"] h2.md-pp-section::after{content:'\2002\2766';color:var(--accent)}
.md-preview-paper[data-price="leader-dots"] .md-pp-row::after{content:'';grid-column:1/-1;border-bottom:1.5px dotted var(--muted);margin:-22px 0 0;height:2px;align-self:start;order:2}
.md-preview-paper[data-price="leader-dots"] .md-pp-row{grid-template-rows:auto auto}
.md-preview-paper[data-price="right-monospace"] .md-pp-price{font-family:ui-monospace,SFMono-Regular,monospace}
.md-preview-paper[data-price="tab-aligned"] .md-pp-row{grid-template-columns:1fr 60px;text-align:right}
.md-preview-paper[data-price="tab-aligned"] .md-pp-name{text-align:left}
.md-preview-paper[data-cols="2"] .md-pp-cols{grid-template-columns:1fr 1fr}
.md-preview-paper[data-section-case="uppercase"] h2.md-pp-section{text-transform:uppercase;letter-spacing:.18em}
.md-preview-paper[data-section-case="small-caps"] h2.md-pp-section{font-variant:small-caps;letter-spacing:.06em}
.md-preview-paper[data-section-case="capitalize"] h2.md-pp-section{text-transform:none}
/* Logo placement variants. */
.md-pp-logo{display:block;margin:0 auto 18px;max-height:80px;max-width:240px}
.md-preview-paper[data-logo-slot="header-left"] .md-pp-logo{margin-left:0}
.md-preview-paper[data-logo-slot="header-right"] .md-pp-logo{margin-left:auto;margin-right:0}
.md-preview-paper[data-logo-slot="watermark"] .md-pp-logo{position:absolute;opacity:.06;max-width:340px;max-height:340px;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:0}
.md-preview-paper[data-logo-slot="watermark"]{position:relative}
.md-preview-paper[data-logo-slot="watermark"] > *{position:relative;z-index:1}
.md-preview-empty{padding:48px 16px;text-align:center;color:var(--stone);font-size:14px}
.md-overflow-warn{margin-top:10px;padding:10px 14px;background:#FFF6F0;border:1px solid #F1D6BC;border-left:3px solid #b86c0f;border-radius:6px;font-size:12.5px;color:#7a4408;line-height:1.55}
.md-overflow-warn[hidden]{display:none}

/* Download row — primary CTA for the print-ready PDF. */
.md-download{margin:18px 0 0;padding:18px 22px;background:var(--cream-2);border:1px solid var(--line);border-radius:12px;display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.md-download-text{font-size:13.5px;color:var(--ink);line-height:1.5;flex:1 1 96px;margin:0}
.md-download-text strong{color:var(--ink);font-weight:600}
.md-download-btn{padding:12px 22px;border:0;border-radius:999px;background:var(--ink);color:var(--cream);font:inherit;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background var(--t-fast)}
.md-download-btn:hover{background:var(--teal)}
.md-download-btn[disabled]{opacity:.55;cursor:wait}
.md-download-msg{font-size:12.5px;color:var(--ink-soft);margin:0;flex-basis:100%}
.md-download-msg.error{color:var(--rust)}
.md-download-msg.success{color:var(--status-good)}
/* Inline "Need help describing?" link under empty description fields. */
.md-help-desc{display:inline-block;margin-top:6px;padding:4px 10px;border:1px dashed var(--line-dark);border-radius:999px;background:transparent;font-size:11.5px;font-weight:600;color:var(--ink-soft);text-decoration:none;line-height:1.3}
.md-help-desc:hover{border-color:var(--teal);color:var(--teal);border-style:solid}
@media(max-width:640px){.md-help-desc{display:block;text-align:center}}
/* Last-3-menus history (Wave A4). Quiet card under download. */
.md-history{margin:18px 0 0;padding:14px 18px;background:var(--white);border:1px solid var(--line);border-radius:10px}
.md-history[hidden]{display:none}
.md-hist-label{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin:0 0 8px}
.md-hist-list{list-style:none;padding:0;margin:0 0 8px;display:flex;flex-direction:column;gap:6px}
.md-hist-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:6px 10px;background:var(--cream-2);border-radius:6px;font-size:13px;flex-wrap:wrap}
.md-hist-theme{font-weight:600;color:var(--ink)}
.md-hist-meta{font-size:12px;color:var(--stone)}
.md-hist-note{font-size:11.5px;color:var(--stone);margin:0;font-style:italic;line-height:1.5}

/* What you leave with / What this is + isn't card. */
.md-honesty{margin:36px auto 0;max-width:720px;padding:22px 24px;background:var(--surface-1,var(--white));border:1px solid var(--line);border-radius:14px;box-shadow:var(--elev-1)}
.md-honesty h3{font-family:var(--font-display);font-size:18px;font-weight:500;color:var(--ink);margin:0 0 8px}
.md-honesty p{font-size:14px;color:var(--ink-soft);line-height:1.6;margin:0 0 14px}
.md-honesty p:last-child{margin-bottom:0}
.md-honesty strong{color:var(--ink);font-weight:600}

/* W5-8 — draft-restore banner. Appears on cold load when a previous menu was in progress. */
.md-draft-banner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:14px 0;padding:12px 16px;background:#eef7f4;border:1px solid #bfe2d6;border-left:3px solid var(--accent,#1f6f6a);border-radius:8px;font-size:14px;color:var(--ink);line-height:1.5}
.md-draft-banner strong{color:var(--ink);font-weight:600}
.md-draft-actions{margin-left:auto;display:flex;gap:8px}
.md-draft-actions button{font-size:13px;padding:7px 12px;border-radius:6px;border:1px solid var(--accent,#1f6f6a);background:var(--accent,#1f6f6a);color:#fff;cursor:pointer;font-weight:500}
.md-draft-actions button.md-draft-discard{background:#fff;color:var(--accent,#1f6f6a)}
.md-draft-actions button:hover{filter:brightness(1.05)}
@media(max-width:540px){.md-draft-actions{margin-left:0;width:100%}.md-draft-actions button{flex:1 1 0}}

/* W5-1 — ghost preview rows + overlay. */
tr[data-ghost="1"]{opacity:.55}
tr[data-ghost="1"] input,tr[data-ghost="1"] textarea{color:var(--ink-soft)}

.md-ghost-overlay strong{color:var(--ink);font-weight:600;display:inline}
.md-ghost-start{margin-left:auto;font-size:13px;padding:6px 12px;border-radius:6px;border:1px solid var(--accent,#1f6f6a);background:var(--accent,#1f6f6a);color:#fff;cursor:pointer;font-weight:500}
.md-ghost-start:hover{filter:brightness(1.05)}
@media(max-width:540px){.md-ghost-start{margin-left:0;width:100%}}

<body>

<a class="skip-link" href="#main">Skip to main content</a>
<header class="nav" id="nav"></header>

<main id="main">

<nav class="breadcrumb container" aria-label="Breadcrumb">
  <a href="/">Home</a>
  <span class="breadcrumb-sep" aria-hidden="true">›</span>
  <a href="/tools/">Tools</a>
  <span class="breadcrumb-sep" aria-hidden="true">›</span>
  <span aria-current="page">Menu Design Suite</span>
</nav>

<section class="block">
  <div class="container" style="max-width:880px;">
    <div class="md-hero">
      <p class="md-eyebrow">Free tool · Menu layout for any dish count</p>
      <h1 style="font-family:var(--font-display);font-size:clamp(30px,4vw,42px);font-weight:500;color:var(--ink);margin:0 0 14px;line-height:1.15;">A menu, laid out for the dishes <span class="serif-italic" style="color:var(--teal);">you actually have</span>.</h1>
      <p style="font-size:16px;color:var(--ink-soft);line-height:1.6;margin:0 0 0;">Canva templates assume 12 dishes. Real restaurants have 14, 27, or 53. Type your dishes, pick a theme, drop your logo — we lay it out onto a printable PDF that fits whatever count you have. No design software, no template fight.</p>
      <p class="md-walkaway"><strong>You leave with:</strong> A printable PDF of your menu — your dishes, your prices, your logo, laid out for whatever count you have.</p>
    </div>

    <!-- "We remember" pill — populated by MuntinContext from prior tool sessions. -->
    <aside class="md-ctx" id="mdCtx" hidden role="status" aria-live="polite">
      <span class="md-ctx-eyebrow">We remember from your last visit</span>
      <ul class="md-ctx-chips" id="mdCtxChips"></ul>
      <button type="button" class="md-ctx-use" id="mdCtxUse">Use these</button>
    </aside>

    <!-- Dish list (canonical input). Mobile collapses to card-stack via data-label. -->
    <div class="md-grid" id="mdGrid">
      <table>
        <thead>
          <tr>
            <th scope="col" style="width:32%;">Dish</th>
            <th scope="col" style="width:18%;">Price</th>
            <th scope="col">Description</th>
            <th scope="col" style="width:36px;"></th>
          </tr>
        </thead>
        <tbody id="mdRows"></tbody>
      </table>
      <div class="md-grid-actions">
        <button type="button" class="md-add-row" id="mdAddRow">+ Add a dish</button>
        <button type="button" class="md-add-section" id="mdAddSection">+ Add a section</button>
        <button type="button" class="md-sample" id="mdSample">Load a sample menu</button>
        <button type="button" class="md-clear" id="mdClear">Clear</button>
      </div>
    </div>

    <button type="button" class="md-stick" id="mdStick">+ Add a dish</button>

    <details class="md-paste" id="mdPaste">
      <summary>Paste your menu from a spreadsheet</summary>
      <div class="md-paste-body">
        <p class="md-paste-help">Paste a CSV or TSV with one row per dish. Headers like <code>Item</code> / <code>Name</code> / <code>Section</code> / <code>Price</code> / <code>Description</code> auto-map (Spanish too: <code>Plato</code>, <code>Sección</code>, <code>Precio</code>). Section headers can also be lines starting with <code>##</code>.</p>
        <textarea id="mdPasteArea" spellcheck="false" autocomplete="off" placeholder="## Starters&#10;Caesar Salad,$14,Crisp little gems with our buttermilk dressing&#10;House Bread,$6&#10;## Mains&#10;Roast Chicken,$28,Half a Path Valley chicken with pan jus"></textarea>
        <div class="md-paste-actions">
          <button type="button" class="md-paste-btn" id="mdPasteApply">Add to my menu</button>
        </div>
      </div>
    </details>

    <p class="md-status" id="mdStatus"><strong>0</strong> dishes · <strong>0</strong> sections — your menu lives in this browser only.</p>

    <!-- Theme picker. Four constrained choices; the menu can't look amateur. -->
    <div class="md-themes">
      <p class="md-themes-label">Pick a theme</p>
      <ul class="md-themes-list" id="mdThemes" role="radiogroup" aria-label="Menu theme"></ul>
    </div>

    <!-- Logo + paper-size row. -->
    <div class="md-options">
      <div class="md-option">
        <p class="md-option-label">Logo (optional)</p>
        <label class="md-logo-drop" id="mdLogoDrop">
          <span class="md-logo-thumb" id="mdLogoThumb"><span class="md-logo-thumb-empty" aria-hidden="true">+</span></span>
          <span class="md-logo-meta">
            <span class="md-logo-meta-line" id="mdLogoLine">Choose or take a photo</span>
            <span class="md-logo-meta-sub">PNG, JPG, or SVG. Stays on this device.</span>
          </span>
          <input type="file" id="mdLogoInput" accept="image/png,image/jpeg,image/svg+xml,image/webp" capture="environment" />
        </label>
        <p class="md-logo-warn" id="mdLogoWarn" hidden></p>
      </div>
      <div class="md-option">
        <p class="md-option-label">Paper</p>
        <div class="md-paper-row" id="mdPaperRow" role="radiogroup" aria-label="Paper size">
          <label><input type="radio" name="md-paper" value="letter" checked /> Letter</label>
          <label><input type="radio" name="md-paper" value="a4" /> A4</label>
          <label><input type="radio" name="md-paper" value="half-page" /> Half-page</label>
        </div>
      </div>
    </div>

    <!-- Live preview — same theme tokens the PDF renderer (Wave A3) will read. -->
    <div class="md-preview-wrap">
      <div class="md-preview-label">
        <span class="md-preview-label-text">Live preview</span>
        <span class="md-preview-label-meta" id="mdPreviewMeta"></span>
      </div>
      <div class="md-preview-frame" id="mdPreviewFrame">
        <article class="md-preview-paper" id="mdPaper" aria-live="polite"></article>
      </div>
      <div class="md-overflow-warn" id="mdOverflow" hidden></div>
    </div>

    <!-- Download — the deliverable. PDF lands in the user's Downloads. -->
    <div class="md-download">
      <p class="md-download-text"><strong>Ready when you are.</strong> Tap Download to save your menu as a PDF. The file is generated in your browser — nothing uploads.</p>
      <button type="button" class="md-download-btn" id="mdDownload" aria-label="Download menu as PDF">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download PDF
      </button>
      <p class="md-download-msg" id="mdDownloadMsg" role="status" aria-live="polite"></p>
    </div>

    <!-- Wave A4: Last-3-menus history. Slim — theme/paper/count/date only. -->
    <div class="md-history" id="mdHistory" hidden></div>

    <!-- What this is / what this isn't — the honesty card. -->
    <div class="md-honesty">
      <h3>What this is, and what it isn't.</h3>
      <p><strong>Is:</strong> an auto-layout engine for any dish count, four typeset themes, letter / A4 / half-page / trifold / table-tent output, CMYK + bleed for print vendors, RGB for sharing.</p>
      <p><strong>Isn't:</strong> a copywriter (<a href="/tools/menu-copy/">Menu Copy Inspector</a> grades and rewrites descriptions), a dish-photo generator (<a href="/tools/photo-brief/">Photo Brief</a> handles the shoot), a translator, a profitability rater (<a href="/tools/menu-engineering/">Menu Engineering</a> scores margin), or InDesign. Themes are intentionally constrained so output can't look amateur.</p>
      <p><strong>Privacy posture:</strong> Open DevTools → Network. Type a dish, paste your menu, change theme. The Network tab stays empty. The page is static HTML plus one unminified JavaScript file you can read directly.</p>
    </div>

  </div>
</section>

</main>
